  <title
     id="svg-title">BGP Lab Topology — IOL interfaces</title>
  <desc
     id="svg-desc">Provider AS 65000 with routers R2, R3, R4, R5, R7 and R8, connected to customer AS 65001 through R1 and AS 65006 through R6. All router-facing links use the requested Eth0/1 interface naming.</desc>
