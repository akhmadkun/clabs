<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">IS-IS Inter-Area Topology</title>
  <desc id="desc">Eight-router IS-IS topology with three areas: 49.1234, 49.0056, and 49.1920.</desc>
  <defs>
    <linearGradient id="areaBlue" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#eaf5ff"/><stop offset="1" stop-color="#d9edff"/></linearGradient>
    <linearGradient id="areaGreen" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#e0f7d9"/><stop offset="1" stop-color="#d4f2cd"/></linearGradient>
    <linearGradient id="areaPurple" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#f0def6"/><stop offset="1" stop-color="#e6caef"/></linearGradient>
    <linearGradient id="routerBlueTop" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#168ce6"/><stop offset="0.55" stop-color="#0872c7"/><stop offset="1" stop-color="#0054a5"/></linearGradient>
    <linearGradient id="routerBlueSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0573c4"/><stop offset="1" stop-color="#003e8f"/></linearGradient>
    <linearGradient id="routerOrangeTop" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffbd23"/><stop offset="0.55" stop-color="#f5a000"/><stop offset="1" stop-color="#d77b00"/></linearGradient>
    <linearGradient id="routerOrangeSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f29b00"/><stop offset="1" stop-color="#b85f00"/></linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#18334e" flood-opacity="0.18"/></filter>
    <style>
      .area-label { font-family: Arial, Helvetica, sans-serif; font-weight: 800; text-anchor: middle; }
      .router-label { font-family: Arial, Helvetica, sans-serif; fill: #07152e; text-anchor: middle; font-weight: 800; }
      .interface-label { font-family: Arial, Helvetica, sans-serif; fill: #07101d; font-size: 23px; font-weight: 700; }
      .vlan { fill: #fa3029; font-weight: 800; }
      .link { fill: none; stroke: #071827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .ibgp-link { fill: none; stroke: #7638b8; stroke-width: 4; stroke-dasharray: 12 9; stroke-linecap: round; stroke-linejoin: round; }
      .ibgp-label { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 800; fill: #542080; text-anchor: middle; }
      .port { fill: #092d40; stroke: #f6fbff; stroke-width: 1.6; }
    </style>
    <g id="router-blue" filter="url(#softShadow)">
      <path d="M8,28 C8,13 31,0 60,0 C89,0 112,13 112,28 L112,58 C112,76 89,92 60,92 C31,92 8,76 8,58 Z" fill="url(#routerBlueSide)" stroke="#ffffff" stroke-width="1.4"/>
      <ellipse cx="60" cy="28" rx="52" ry="28" fill="url(#routerBlueTop)" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M22,29 C31,39 46,43 60,43 C78,43 93,37 99,29" fill="none" stroke="#79c7ff" stroke-width="1.2" opacity="0.62"/>
      <g fill="none" stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round" stroke-width="3.2">
        <path d="M53 27 L35 14 M35 14 L38 24 M35 14 L45 16"/>
        <path d="M67 27 L85 14 M85 14 L75 16 M85 14 L82 24"/>
        <path d="M53 33 L35 46 M35 46 L38 36 M35 46 L45 44"/>
        <path d="M67 33 L85 46 M85 46 L75 44 M85 46 L82 36"/>
      </g>
    </g>
    <g id="router-orange" filter="url(#softShadow)">
      <path d="M8,28 C8,13 31,0 60,0 C89,0 112,13 112,28 L112,58 C112,76 89,92 60,92 C31,92 8,76 8,58 Z" fill="url(#routerOrangeSide)" stroke="#ffffff" stroke-width="1.4"/>
      <ellipse cx="60" cy="28" rx="52" ry="28" fill="url(#routerOrangeTop)" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M22,29 C31,39 46,43 60,43 C78,43 93,37 99,29" fill="none" stroke="#ffe19a" stroke-width="1.2" opacity="0.7"/>
      <g fill="none" stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round" stroke-width="3.2">
        <path d="M53 27 L35 14 M35 14 L38 24 M35 14 L45 16"/>
        <path d="M67 27 L85 14 M85 14 L75 16 M85 14 L82 24"/>
        <path d="M53 33 L35 46 M35 46 L38 36 M35 46 L45 44"/>
        <path d="M67 33 L85 46 M85 46 L75 44 M85 46 L82 36"/>
      </g>
    </g>
  </defs>

  <rect width="1536" height="1024" fill="#ffffff"/>

  <!-- Routing areas -->
  <g id="area-49-1234">
    <rect x="29" y="95" width="620" height="887" rx="38" fill="url(#areaBlue)" stroke="#4e9eff" stroke-width="2"/>
    <text class="area-label" x="450" y="257" font-size="41" fill="#123675">AREA</text>
    <text class="area-label" x="450" y="298" font-size="40" fill="#123675">49.1234</text>
  </g>
  <g id="area-49-0056">
    <rect x="766" y="311" width="361" height="672" rx="31" fill="url(#areaGreen)" stroke="#79dc61" stroke-width="2"/>
    <text class="area-label" x="947" y="369" font-size="38" fill="#064a3c">AREA</text>
    <text class="area-label" x="947" y="412" font-size="38" fill="#064a3c">49.0056</text>
  </g>
  <g id="area-49-1920">
    <rect x="1140" y="22" width="375" height="575" rx="33" fill="url(#areaPurple)" stroke="#b66bd7" stroke-width="2"/>
    <text class="area-label" x="1328" y="69" font-size="40" fill="#2b105b">AREA</text>
    <text class="area-label" x="1328" y="111" font-size="40" fill="#2b105b">49.1920</text>
  </g>

  <!-- Links are separate editable objects -->
  <g id="links" class="link">
    <path id="link-r1-r2" d="M193 286 L193 404"/>
    <path id="link-r2-r3" d="M255 453 L501 552"/>
    <path id="link-r2-r4" d="M222 493 L462 817"/>
    <path id="link-r3-r4" d="M558 612 L558 801"/>
    <path id="link-r3-r6" d="M617 558 L889 558"/>
    <path id="link-r4-r6" d="M574 821 L898 588"/>
    <path id="link-r4-r5" d="M575 846 L889 846"/>
    <path id="link-r5-r6" d="M947 790 L947 612"/>
    <path id="link-r6-xr1" d="M1007 555 L1304 478"/>
    <path id="link-r5-xr1" d="M1002 815 L1328 503"/>
    <path id="link-xr1-xr2" d="M1363 277 L1363 406"/>
    <path id="link-ibgp-r1-xr2" class="ibgp-link" d="M247 225 C 455 82, 1088 82, 1308 222"/>
  </g>

  <!-- Port dots -->
  <g id="ports" class="port">
    <circle cx="193" cy="286" r="6"/><circle cx="193" cy="404" r="6"/>
    <circle cx="255" cy="453" r="6"/><circle cx="501" cy="552" r="6"/>
    <circle cx="222" cy="493" r="6"/><circle cx="462" cy="817" r="6"/>
    <circle cx="558" cy="612" r="6"/><circle cx="558" cy="801" r="6"/>
    <circle cx="617" cy="558" r="6"/><circle cx="889" cy="558" r="6"/>
    <circle cx="574" cy="821" r="6"/><circle cx="898" cy="588" r="6"/>
    <circle cx="575" cy="846" r="6"/><circle cx="889" cy="846" r="6"/>
    <circle cx="947" cy="790" r="6"/><circle cx="947" cy="612" r="6"/>
    <circle cx="1007" cy="555" r="6"/><circle cx="1304" cy="478" r="6"/>
    <circle cx="1002" cy="815" r="6"/><circle cx="1328" cy="503" r="6"/>
    <circle cx="1363" cy="277" r="6"/><circle cx="1363" cy="406" r="6"/>
  </g>

  <!-- Interface labels: prefix and VLAN ID are intentionally separate text elements -->
  <g id="interface-labels" class="interface-label">
    <text x="202" y="343">Eth0/1.<tspan class="vlan">12</tspan></text>
    <text x="330" y="464">Eth0/1.<tspan class="vlan">23</tspan></text>
    <text x="214" y="652">Eth0/1.<tspan class="vlan">24</tspan></text>
    <text x="567" y="675">Eth0/1.<tspan class="vlan">34</tspan></text>
    <text x="693" y="548">Eth0/1.<tspan class="vlan">36</tspan></text>
    <text x="720" y="747" transform="rotate(-20 720 747)">Eth0/1.<tspan class="vlan">46</tspan></text>
    <text x="685" y="873">Eth0/1.<tspan class="vlan">45</tspan></text>
    <text x="956" y="706">Eth0/1.<tspan class="vlan">56</tspan></text>
    <text x="1097" y="518" transform="rotate(-15 1097 518)">Gi0/0/0/0.<tspan class="vlan">619</tspan></text>
    <text x="1149" y="704">Gi0/0/0/0.<tspan class="vlan">519</tspan></text>
    <text x="1212" y="355">Gi0/0/0/0.<tspan class="vlan">1920</tspan></text>
  </g>

  <!-- Editable logical iBGP session label -->
  <g id="ibgp-r1-xr2-label">
    <rect x="748" y="101" width="106" height="39" rx="10" fill="#ffffff" fill-opacity="0.96" stroke="#7638b8" stroke-width="1.8"/>
    <text class="ibgp-label" x="801" y="127">iBGP</text>
  </g>

  <!-- Router nodes and labels -->
  <g id="router-r1">
    <text class="router-label" x="195" y="157" font-size="29">R1</text>
    <text class="router-label" x="195" y="184" font-size="25">(IOL)</text>
    <use xlink:href="#router-blue" x="135" y="191" width="120" height="100"/>
  </g>
  <g id="router-r2">
    <text class="router-label" x="115" y="449" font-size="29">R2</text>
    <text class="router-label" x="115" y="476" font-size="25">(IOL)</text>
    <use xlink:href="#router-blue" x="135" y="403" width="120" height="100"/>
  </g>
  <g id="router-r3">
    <text class="router-label" x="558" y="483" font-size="29">R3</text>
    <text class="router-label" x="558" y="510" font-size="25">(IOL)</text>
    <use xlink:href="#router-blue" x="498" y="518" width="120" height="100"/>
  </g>
  <g id="router-r4">
    <use xlink:href="#router-blue" x="456" y="799" width="120" height="100"/>
    <text class="router-label" x="516" y="916" font-size="29">R4</text>
    <text class="router-label" x="516" y="943" font-size="25">(IOL)</text>
  </g>
  <g id="router-r5">
    <use xlink:href="#router-blue" x="887" y="799" width="120" height="100"/>
    <text class="router-label" x="947" y="916" font-size="29">R5</text>
    <text class="router-label" x="947" y="943" font-size="25">(IOL)</text>
  </g>
  <g id="router-r6">
    <text class="router-label" x="947" y="463" font-size="29">R6</text>
    <text class="router-label" x="947" y="490" font-size="25">(IOL)</text>
    <use xlink:href="#router-blue" x="887" y="519" width="120" height="100"/>
  </g>
  <g id="router-xr2">
    <text class="router-label" x="1362" y="153" font-size="27">XR2</text>
    <text class="router-label" x="1362" y="176" font-size="21">(IOS-XR)</text>
    <use xlink:href="#router-orange" x="1303" y="184" width="120" height="100"/>
  </g>
  <g id="router-xr1">
    <use xlink:href="#router-orange" x="1303" y="415" width="120" height="100"/>
    <text class="router-label" x="1450" y="449" font-size="27">XR1</text>
    <text class="router-label" x="1450" y="476" font-size="21">(IOS-XR)</text>
  </g>
</svg>
