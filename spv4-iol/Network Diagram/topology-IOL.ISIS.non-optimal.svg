<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1422" height="1106" viewBox="0 0 1422 1106" role="img" aria-labelledby="title desc">
  <title id="title">IOL ISIS non-optimal topology</title>
  <desc id="desc">Six blue routers across areas 49.1234 and 49.0056, connected to two orange XR routers in area 49.1920.</desc>
  <defs>
    <linearGradient id="area-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="area-middle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff1df"/>
      <stop offset="1" stop-color="#eaf7e8"/>
    </linearGradient>
    <linearGradient id="area-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7ddea"/>
      <stop offset="1" stop-color="#d9cce1"/>
    </linearGradient>
    <linearGradient id="router-blue-fill" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#169ce0"/>
      <stop offset="1" stop-color="#0871ad"/>
    </linearGradient>
    <linearGradient id="router-orange-fill" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffb12a"/>
      <stop offset="1" stop-color="#d98100"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feOffset dy="1" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fff"/>
    </marker>
    <g id="router-blue" filter="url(#soft-shadow)">
      <ellipse cx="0" cy="0" rx="47" ry="35" fill="url(#router-blue-fill)" stroke="#ffffff" stroke-width="1.6"/>
      <path d="M -5 -4 L -27 -21" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" marker-end="url(#arrow-white)"/>
      <path d="M 5 -4 L 27 -21" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" marker-end="url(#arrow-white)"/>
      <path d="M -5 4 L -27 21" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" marker-end="url(#arrow-white)"/>
      <path d="M 5 4 L 27 21" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" marker-end="url(#arrow-white)"/>
    </g>
    <g id="router-orange" filter="url(#soft-shadow)">
      <ellipse cx="0" cy="0" rx="47" ry="35" fill="url(#router-orange-fill)" stroke="#ffffff" stroke-width="1.6"/>
      <path d="M -5 -4 L -27 -21" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" marker-end="url(#arrow-white)"/>
      <path d="M 5 -4 L 27 -21" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" marker-end="url(#arrow-white)"/>
      <path d="M -5 4 L -27 21" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" marker-end="url(#arrow-white)"/>
      <path d="M 5 4 L 27 21" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" marker-end="url(#arrow-white)"/>
    </g>
    <style>
      .area-label { font-family: Arial, Helvetica, sans-serif; font-size: 40px; font-weight: 700; text-anchor: middle; fill: #050505; }
      .router-label { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #050505; }
      .port-label { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 600; fill: #111; }
      .link { fill: none; stroke: #202020; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1422" height="1106" fill="#ffffff"/>

  <!-- ISIS areas -->
  <g id="areas">
    <rect x="32" y="83" width="568" height="978" rx="55" fill="url(#area-left)" stroke="#777" stroke-width="2"/>
    <rect x="746" y="388" width="300" height="682" rx="46" fill="url(#area-middle)" stroke="#69bd61" stroke-width="2"/>
    <rect x="1068" y="32" width="299" height="623" rx="43" fill="url(#area-right)" stroke="#a879b2" stroke-width="2"/>
    <text class="area-label" x="451" y="249">AREA</text>
    <text class="area-label" x="451" y="297">49.1234</text>
    <text class="area-label" x="896" y="459">AREA</text>
    <text class="area-label" x="896" y="507">49.0056</text>
    <text class="area-label" x="1218" y="91">AREA</text>
    <text class="area-label" x="1218" y="139">49.1920</text>
  </g>

  <!-- Physical links. Keep links separate from routers for easy editing. -->
  <g id="links" class="link">
    <!-- Area 49.1234 internal links -->
    <path id="link-r1-r3" d="M 250 252 L 467 620"/>
    <path id="link-r1-r4" d="M 220 257 L 471 875"/>
    <path id="link-r2-r3" d="M 260 486 L 463 631"/>
    <path id="link-r2-r4" d="M 222 524 L 470 875"/>
    <path id="link-r3-r4" d="M 506 688 L 506 873"/>
    <!-- Links between areas 49.1234 and 49.0056 -->
    <path id="link-r3-r6" d="M 554 654 L 862 654"/>
    <path id="link-r4-r6" d="M 543 881 L 865 687"/>
    <path id="link-r4-r5" d="M 554 911 L 862 911"/>
    <path id="link-r6-r5" d="M 909 693 L 909 872"/>
    <!-- Links from area 49.0056 to area 49.1920 -->
    <path id="link-r6-xr1" d="M 953 638 L 1182 488"/>
    <path id="link-r5-xr1" d="M 949 883 L 1184 507"/>
    <path id="link-xr2-xr1" d="M 1224 260 L 1224 447"/>
  </g>

  <!-- Port labels -->
  <g id="port-labels" class="port-label">
    <text x="337" y="367" transform="rotate(58 337 367)">Eth0/1.13</text>
    <text x="286" y="408" transform="rotate(64 286 408)">Eth0/1.14</text>
    <text x="347" y="549" transform="rotate(34 347 549)">Eth0/1.23</text>
    <text x="324" y="669" transform="rotate(55 324 669)">Eth0/1.24</text>
    <text x="487" y="788" transform="rotate(-90 487 788)">Eth0/1.34</text>
    <text x="645" y="635">Eth0/1.36</text>
    <text x="647" y="759" transform="rotate(-30 647 759)">Eth0/1.46</text>
    <text x="640" y="893">Eth0/1.45</text>
    <text x="892" y="787" transform="rotate(-90 892 787)">Eth0/1.56</text>
    <text x="1077" y="553" transform="rotate(-34 1077 553)">Gi0/0/0.619</text>
    <text x="1000" y="706" transform="rotate(-57 1000 706)">Gi0/0/0.519</text>
    <text x="1075" y="349">Gi0/0/0.1920</text>
  </g>

  <!-- Routers -->
  <g id="routers">
    <use xlink:href="#router-blue" x="224" y="222" width="100" height="75"/>
    <use xlink:href="#router-blue" x="224" y="487" width="100" height="75"/>
    <use xlink:href="#router-blue" x="506" y="654" width="100" height="75"/>
    <use xlink:href="#router-blue" x="506" y="911" width="100" height="75"/>
    <use xlink:href="#router-blue" x="909" y="655" width="100" height="75"/>
    <use xlink:href="#router-blue" x="909" y="911" width="100" height="75"/>
    <use xlink:href="#router-orange" x="1224" y="223" width="100" height="75"/>
    <use xlink:href="#router-orange" x="1224" y="475" width="100" height="75"/>
  </g>

  <!-- Router names -->
  <g id="router-names" class="router-label">
    <text x="224" y="171" text-anchor="middle">R1</text>
    <text x="142" y="490">R2</text>
    <text x="491" y="604">R3</text>
    <text x="489" y="963">R4</text>
    <text x="909" y="620" text-anchor="middle">R6</text>
    <text x="909" y="960" text-anchor="middle">R5</text>
    <text x="1224" y="174" text-anchor="middle">XR2</text>
    <text x="1284" y="490">XR1</text>
  </g>
</svg>
