<text x="590" y="232" text-anchor="middle" font-family="Arial" font-size="15">adosztal/aaa:latest</text>
<text x="590" y="258" text-anchor="middle" font-family="Arial" font-size="15">192.168.122.20</text>
<text x="590" y="282" text-anchor="middle" font-family="Arial" font-size="14">alice / gns3</text>

<rect x="785" y="175" width="250" height="125" rx="15" fill="#fff3e8" stroke="#c77728" stroke-width="2"/>
<text x="910" y="205" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">TACACS+</text>
<text x="910" y="232" text-anchor="middle" font-family="Arial" font-size="15">adosztal/aaa:latest</text>
<text x="910" y="258" text-anchor="middle" font-family="Arial" font-size="15">192.168.122.21</text>
<text x="910" y="282" text-anchor="middle" font-family="Arial" font-size="14">gns3 / readonly</text>

<rect x="595" y="345" width="310" height="85" rx="14" fill="#ffffff" stroke="#666" stroke-width="2"/>
