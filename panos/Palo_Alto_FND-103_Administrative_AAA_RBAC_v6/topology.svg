<text x="750" y="402" text-anchor="middle" font-family="Arial" font-size="15">192.168.122.30/24</text>

<line x1="310" y1="210" x2="465" y2="210" stroke="#333" stroke-width="3"/>
<line x1="310" y1="245" x2="785" y2="245" stroke="#333" stroke-width="1.5" stroke-dasharray="7 6"/>
