<text x="185" y="155" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">PA-VM</text>
<text x="185" y="185" text-anchor="middle" font-family="Arial" font-size="16">MGT 192.168.122.10/24</text>
<text x="185" y="215" text-anchor="middle" font-family="Arial" font-size="15">RADIUS → UDP/1812</text>
<text x="185" y="242" text-anchor="middle" font-family="Arial" font-size="15">TACACS+ → TCP/49</text>
<text x="185" y="269" text-anchor="middle" font-family="Arial" font-size="14">RADIUS → TACACS+ → Local</text>

<rect x="425" y="105" width="650" height="360" rx="22" fill="#f5f5f5" stroke="#777" stroke-width="2"/>
