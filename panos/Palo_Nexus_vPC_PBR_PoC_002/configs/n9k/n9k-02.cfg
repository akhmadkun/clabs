version 10.3(5)
hostname N9K-02
feature lacp
feature vpc
feature hsrp

vlan 100
  name INSIDE
vlan 200
  name OUTSIDE

vrf context VPC-KA

interface Ethernet1/3
  description VPC PEER-KEEPALIVE
  no switchport
  vrf member VPC-KA
  ip address 10.255.0.2/30
  no shutdown

interface Ethernet1/1
  description VPC PEER-LINK MEMBER-1
  channel-group 100 mode active
  no shutdown
interface Ethernet1/2
  description VPC PEER-LINK MEMBER-2
  channel-group 100 mode active
  no shutdown

interface port-channel100
  description VPC PEER-LINK
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 100,200
  spanning-tree port type network
  vpc peer-link
  no shutdown

vpc domain 10
  peer-keepalive destination 10.255.0.1 source 10.255.0.2 vrf VPC-KA
  role priority 200
  peer-gateway
  ip arp synchronize

interface Vlan100
  description INSIDE SVI
  no shutdown
  ip address 10.100.100.3/24
  hsrp 100
    ip 10.100.100.1

interface Vlan200
  description OUTSIDE SVI
  no shutdown
  ip address 10.200.200.3/24
  hsrp 200
    ip 10.200.200.1

interface Ethernet1/4
  description PA AE1 MEMBER
  channel-group 20 mode active
  no shutdown

interface port-channel20
  description PA AE1 DOWNLINK
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 100,200
  spanning-tree port type edge
  vpc 20
  no shutdown

interface Ethernet1/5
  description MT-OUTSIDE
  switchport
  switchport access vlan 200
  spanning-tree port type edge
  no shutdown
