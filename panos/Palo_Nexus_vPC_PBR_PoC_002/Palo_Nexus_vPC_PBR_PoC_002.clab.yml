name: palo-nexus-vpc-pbr-poc
prefix: ""

mgmt:
  network: palo-nexus-vpc-pbr-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  nodes:
    n9k-01:
      kind: cisco_n9kv
      image: arthurk99/cisco-nxos9000v:10.3.5
      mgmt-ipv4: 172.30.30.11
      startup-config: ./configs/n9k/n9k-01.cfg

    n9k-02:
      kind: cisco_n9kv
      image: arthurk99/cisco-nxos9000v:10.3.5
      mgmt-ipv4: 172.30.30.12
      startup-config: ./configs/n9k/n9k-02.cfg

    pa-01:
      kind: paloalto_panos
      image: vrnetlab/paloalto_pa-vm:11.2.5
      mgmt-ipv4: 172.30.30.13

    mt-inside-pbr:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      binds:
        - ./configs/clients/inside-pbr-init.sh:/config/inside-pbr-init.sh:ro
      exec:
        - bash /config/inside-pbr-init.sh

    mt-inside-normal:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      binds:
        - ./configs/clients/inside-normal-init.sh:/config/inside-normal-init.sh:ro
      exec:
        - bash /config/inside-normal-init.sh

    mt-outside:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      binds:
        - ./configs/clients/outside-init.sh:/config/outside-init.sh:ro
      exec:
        - bash /config/outside-init.sh

  links:
    - endpoints: ["n9k-01:eth1", "n9k-02:eth1"]
    - endpoints: ["n9k-01:eth2", "n9k-02:eth2"]
    - endpoints: ["n9k-01:eth3", "n9k-02:eth3"]
    - endpoints: ["n9k-01:eth4", "pa-01:eth1"]
    - endpoints: ["n9k-02:eth4", "pa-01:eth2"]
    - endpoints: ["n9k-01:eth5", "mt-inside-pbr:eth1"]
    - endpoints: ["n9k-01:eth6", "mt-inside-normal:eth1"]
    - endpoints: ["n9k-02:eth5", "mt-outside:eth1"]
