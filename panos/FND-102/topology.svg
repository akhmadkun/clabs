<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" fill="white"/><text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">FND-102 — Configuration Lifecycle &amp; Rollback</text><rect x="80" y="95" width="260" height="95" rx="12" fill="#eef5ff" stroke="#4a78a8" stroke-width="2"/><text x="210" y="130" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">Management Host</text><text x="210" y="158" text-anchor="middle" font-family="Arial" font-size="16">HTTPS 443 / SSH 22</text><rect x="420" y="95" width="280" height="95" rx="12" fill="#fff7e6" stroke="#b8860b" stroke-width="2"/><text x="560" y="130" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">PA-VM</text><text x="560" y="158" text-anchor="middle" font-family="Arial" font-size="16">192.168.121.10/24</text><rect x="760" y="95" width="260" height="95" rx="12" fill="#eef9ee" stroke="#4f8a4f" stroke-width="2"/><text x="890" y="130" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">Console Access</text><text x="890" y="158" text-anchor="middle" font-family="Arial" font-size="16">Recovery path</text><line x1="340" y1="142" x2="420" y2="142" stroke="#333" stroke-width="3"/><line x1="700" y1="142" x2="760" y2="142" stroke="#333" stroke-width="3" stroke-dasharray="8,6"/><rect x="110" y="260" width="880" height="180" rx="15" fill="#fafafa" stroke="#777" stroke-width="2"/><text x="550" y="295" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">FND-102 Workflow</text><text x="160" y="340" font-family="Arial" font-size="17">1. Candidate changes</text><text x="160" y="370" font-family="Arial" font-size="17">2. show config diff</text><text x="160" y="400" font-family="Arial" font-size="17">3. Save snapshot</text><text x="510" y="340" font-family="Arial" font-size="17">4. Revert candidate</text><text x="510" y="370" font-family="Arial" font-size="17">5. Reload snapshot</text><text x="510" y="400" font-family="Arial" font-size="17">6. Validate + Commit</text><text x="760" y="340" font-family="Arial" font-size="17">7. Disable HTTPS + SSH</text><text x="760" y="370" font-family="Arial" font-size="17">8. Console recovery</text><text x="760" y="400" font-family="Arial" font-size="17">9. Load old version + Commit</text><text x="550" y="485" text-anchor="middle" font-family="Arial" font-size="15">SSH stays on TCP/22 throughout the lab; CR-102-B disables SSH to create the outage.</text></svg>