set -g mouse on
set-option -g default-shell /usr/bin/zsh

##### Split window shortcuts #####
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

#### freeze pane
bind f if-shell "[ #{pane_input_off} -eq 1 ]" \
    "select-pane -e; display-message 'Pane ENABLED'" \
    "select-pane -d; display-message 'Pane DISABLED'"

# Save Output
bind-key S run-shell "tmux capture-pane -pS -10000 > ~/tmp/tmux_log_$(date +%Y%m%d_%H%M%S).txt" \; display-message "Log disimpan dengan timestamp"

# Synch Panes
bind-key e set-window-option synchronize-panes

# Memberi warna latar belakang berbeda saat pane di-disable
setw -g window-style 'bg=default'
setw -g window-active-style 'bg=default'

# Bind Prefix + 6 untuk membuat window baru dengan 6 pane proporsional
#bind 6 new-window \; split-window \; split-window \; split-window \; select-layout tiled \; split-window \; split-window \; select-layout tiled

#bind 6 new-window -n 'Lab' 'echo ssh admin@R1' \; \
  split-window -v 'echo ssh admin@R2' \; \
  split-window -h 'echo ssh admin@R3' \; \
  split-window -v 'echo ssh admin@R4' \; \
  select-layout tiled \; \
  split-window -h 'echo ssh admin@R5' \; \
  split-window -v 'echo ssh admin@R6' \; \
  select-layout tiled

bind 6 new-window -n 'Lab' 'echo ssh admin@R1; exec "$SHELL" -l' \; \
  split-window -v 'echo ssh admin@R2; exec "$SHELL" -l' \; \
  split-window -h 'echo ssh admin@R3; exec "$SHELL" -l' \; \
  split-window -v 'echo ssh admin@R4; exec "$SHELL" -l' \; \
  select-layout tiled \; \
  split-window -h 'echo ssh admin@R5; exec "$SHELL" -l' \; \
  split-window -v 'echo ssh admin@R6; exec "$SHELL" -l' \; \
  select-layout tiled

# Bind Prefix + 4 untuk membuat window baru dengan 6 pane proporsional
# bind 4 new-window \; split-window \;  split-window \; select-layout tiled \; split-window \; select-layout tiled
bind 4 new-window -n 'Lab' 'echo ssh admin@R1; exec "$SHELL" -l' \; \
  split-window -v 'echo ssh admin@R2; exec "$SHELL" -l' \; \
  split-window -h 'echo ssh admin@R3; exec "$SHELL" -l' \; \
  split-window -v 'echo ssh admin@R4; exec "$SHELL" -l' \; \
  select-layout tiled \; \
  select-layout tiled


# pane reverse
bind-key O select-pane -t :.-

# pane display
set -g display-panes-time 3000
