<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">LAB-007 — OSPF Broadcast Domain and Area 1 Link</title>
  <desc id="desc">R1 through R4 share one Area 0 broadcast domain using eth1.1234. R1 and R3 also have a separate point-to-point link in Area 1 using eth1.13.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#f2f6fb"/>
    </linearGradient>
    <linearGradient id="routerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1687c9"/>
      <stop offset="1" stop-color="#08639b"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#14304a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 38px Inter, Arial, Helvetica, sans-serif; fill: #152b42; }
      .subtitle { font: 400 20px Inter, Arial, Helvetica, sans-serif; fill: #61758a; }
      .areaTitle { font: 700 23px Inter, Arial, Helvetica, sans-serif; letter-spacing: .4px; }
      .areaSub { font: 500 16px Inter, Arial, Helvetica, sans-serif; }
      .routerName { font: 700 23px Inter, Arial, Helvetica, sans-serif; fill: #ffffff; }
      .rid { font: 500 16px Inter, Arial, Helvetica, sans-serif; fill: #485f75; }
      .ifLabel { font: 700 16px Inter, Arial, Helvetica, sans-serif; fill: #075f97; }
      .pillText { font: 700 18px Inter, Arial, Helvetica, sans-serif; fill: #135b8c; }
      .pillSub { font: 500 15px Inter, Arial, Helvetica, sans-serif; fill: #4d6d86; }
      .linkText { font: 700 18px Inter, Arial, Helvetica, sans-serif; fill: #a92f35; }
      .endpointTitle { font: 700 21px Inter, Arial, Helvetica, sans-serif; fill: #20364c; }
      .endpointIf { font: 600 16px Inter, Arial, Helvetica, sans-serif; fill: #a92f35; }
      .footer { font: 400 15px Inter, Arial, Helvetica, sans-serif; fill: #64778b; }
    </style>
    <g id="routerGlyph" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-24 0 H24 M0 -24 V24"/>
      <path d="M-24 0 l8 -7 M-24 0 l8 7 M24 0 l-8 -7 M24 0 l-8 7"/>
      <path d="M0 -24 l-7 8 M0 -24 l7 8 M0 24 l-7 -8 M0 24 l7 -8"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="58" class="title" text-anchor="middle">LAB-007 — OSPF Interface Types &amp; Adjacency</text>
  <text x="800" y="94" class="subtitle" text-anchor="middle">One shared broadcast network in Area 0, plus an additional R1–R3 link in Area 1</text>

  <!-- Area 0 shared broadcast segment -->
  <rect x="65" y="130" width="1470" height="465" rx="28" fill="#edf7ff" stroke="#8cc7ee" stroke-width="2.5"/>
  <rect x="92" y="151" width="415" height="43" rx="12" fill="#d9efff"/>
  <circle cx="116" cy="172.5" r="7" fill="#117bb8"/>
  <text x="135" y="180" class="areaTitle" fill="#0a669f">AREA 0.0.0.0 · BROADCAST</text>
  <text x="1495" y="179" text-anchor="end" class="areaSub" fill="#3b7298">Same Layer-2 segment for all four routers</text>

  <!-- Segment label -->
  <rect x="510" y="220" width="580" height="68" rx="16" fill="#ffffff" stroke="#b5daf3" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="248" text-anchor="middle" class="pillText">SHARED BROADCAST DOMAIN</text>
  <text x="800" y="272" text-anchor="middle" class="pillSub">Interface eth1.1234 on R1 · R2 · R3 · R4</text>

  <!-- Shared bus is drawn behind the router symbols to emphasize a common segment. -->
  <path d="M205 365 H1395" stroke="#1785c4" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="205" cy="365" r="8" fill="#1785c4" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1395" cy="365" r="8" fill="#1785c4" stroke="#ffffff" stroke-width="3"/>

  <!-- Routers R1-R4 -->
  <g filter="url(#shadow)">
    <circle cx="240" cy="365" r="52" fill="url(#routerFill)" stroke="#075584" stroke-width="3"/>
    <circle cx="613" cy="365" r="52" fill="url(#routerFill)" stroke="#075584" stroke-width="3"/>
    <circle cx="986" cy="365" r="52" fill="url(#routerFill)" stroke="#075584" stroke-width="3"/>
    <circle cx="1359" cy="365" r="52" fill="url(#routerFill)" stroke="#075584" stroke-width="3"/>
  </g>
  <use href="#routerGlyph" x="240" y="365"/>
  <use href="#routerGlyph" x="613" y="365"/>
  <use href="#routerGlyph" x="986" y="365"/>
  <use href="#routerGlyph" x="1359" y="365"/>
  <text x="240" y="435" class="endpointTitle" text-anchor="middle">R1</text>
  <text x="613" y="435" class="endpointTitle" text-anchor="middle">R2</text>
  <text x="986" y="435" class="endpointTitle" text-anchor="middle">R3</text>
  <text x="1359" y="435" class="endpointTitle" text-anchor="middle">R4</text>
  <text x="240" y="460" class="rid" text-anchor="middle">RID 10.1.1.1</text>
  <text x="613" y="460" class="rid" text-anchor="middle">RID 10.1.1.2</text>
  <text x="986" y="460" class="rid" text-anchor="middle">RID 10.1.1.3</text>
  <text x="1359" y="460" class="rid" text-anchor="middle">RID 10.1.1.4</text>

  <!-- Interface tags -->
  <g>
    <rect x="163" y="478" width="154" height="37" rx="10" fill="#d9efff" stroke="#abd6f2"/>
    <rect x="536" y="478" width="154" height="37" rx="10" fill="#d9efff" stroke="#abd6f2"/>
    <rect x="909" y="478" width="154" height="37" rx="10" fill="#d9efff" stroke="#abd6f2"/>
    <rect x="1282" y="478" width="154" height="37" rx="10" fill="#d9efff" stroke="#abd6f2"/>
    <text x="240" y="502" class="ifLabel" text-anchor="middle">eth1.1234</text>
    <text x="613" y="502" class="ifLabel" text-anchor="middle">eth1.1234</text>
    <text x="986" y="502" class="ifLabel" text-anchor="middle">eth1.1234</text>
    <text x="1359" y="502" class="ifLabel" text-anchor="middle">eth1.1234</text>
  </g>
  <text x="800" y="552" class="areaSub" text-anchor="middle" fill="#3c7399">All four interfaces attach to the same broadcast domain — not four separate point-to-point links</text>

  <!-- Area 1 additional R1-R3 point-to-point link -->
  <rect x="65" y="635" width="1470" height="292" rx="28" fill="#fff3f2" stroke="#f0b2b0" stroke-width="2.5"/>
  <rect x="92" y="656" width="394" height="43" rx="12" fill="#ffe2df"/>
  <circle cx="116" cy="677.5" r="7" fill="#ca4148"/>
  <text x="135" y="685" class="areaTitle" fill="#a92f35">AREA 1 · 0.0.0.1</text>
  <text x="1495" y="684" text-anchor="end" class="areaSub" fill="#a35a5b">Separate point-to-point link: R1 ↔ R3</text>

  <!-- Router endpoint markers for the second link -->
  <rect x="147" y="751" width="260" height="116" rx="18" fill="#ffffff" stroke="#efb3b1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1193" y="751" width="260" height="116" rx="18" fill="#ffffff" stroke="#efb3b1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="183" cy="787" r="11" fill="#ca4148"/>
  <circle cx="1417" cy="787" r="11" fill="#ca4148"/>
  <text x="277" y="791" text-anchor="middle" class="endpointTitle">R1</text>
  <text x="1323" y="791" text-anchor="middle" class="endpointTitle">R3</text>
  <text x="277" y="827" text-anchor="middle" class="endpointIf">eth1.13</text>
  <text x="1323" y="827" text-anchor="middle" class="endpointIf">eth1.13</text>
  <text x="277" y="849" text-anchor="middle" class="areaSub" fill="#8e5a5d">Area 1 interface</text>
  <text x="1323" y="849" text-anchor="middle" class="areaSub" fill="#8e5a5d">Area 1 interface</text>

  <!-- Point-to-point path and central label -->
  <path d="M407 809 H1193" stroke="#c93d44" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="407" cy="809" r="7" fill="#c93d44"/>
  <circle cx="1193" cy="809" r="7" fill="#c93d44"/>
  <rect x="565" y="772" width="470" height="74" rx="16" fill="#fff3f2" stroke="#efb3b1" stroke-width="2"/>
  <text x="800" y="801" text-anchor="middle" class="linkText">R1 ↔ R3 · POINT-TO-POINT</text>
  <text x="800" y="826" text-anchor="middle" class="areaSub" fill="#a35a5b">Logical link on eth1.13 at both ends</text>

  <!-- Footer / assumptions -->
  <text x="800" y="965" text-anchor="middle" class="footer">Logical OSPF topology only · IP addresses intentionally omitted · existing br-univ is an external L2 underlay, not an OSPF router</text>
</svg>
