name: russo-bgp-iol
prefix: ""
mgmt:
  network: fixedips
  ipv4-subnet: 10.200.255.0/24

topology:
  kinds:
    cisco_iol:
      image: arthurk99/cisco-iol:17.15.01
      #image: archtop/cisco_iol:latest
    ceos:
      image: ceos:4.35.0F
  nodes:
    R1:
      kind: cisco_iol
      mgmt-ipv4: 10.200.255.2
      startup-config: lab_configs/iol_http_source.partial
    R2:
      kind: cisco_iol
      mgmt-ipv4: 10.200.255.3
      startup-config: lab_configs/iol_http_source.partial
    R3:
      kind: cisco_iol
      mgmt-ipv4: 10.200.255.4
      startup-config: lab_configs/iol_http_source.partial
    R4:
      kind: cisco_iol
      mgmt-ipv4: 10.200.255.5
      startup-config: lab_configs/iol_http_source.partial
    R5:
      kind: cisco_iol
      mgmt-ipv4: 10.200.255.6
      startup-config: lab_configs/iol_http_source.partial
    R6:
      kind: cisco_iol
      mgmt-ipv4: 10.200.255.7
      startup-config: lab_configs/iol_http_source.partial
    R7:
      kind: cisco_iol
      mgmt-ipv4: 10.200.255.8
      startup-config: lab_configs/iol_http_source.partial
    R8:
      kind: cisco_iol
      mgmt-ipv4: 10.200.255.9
      startup-config: lab_configs/iol_http_source.partial
    br-univ:
      kind: bridge

  links:
    - endpoints: ["R1:eth1","R2:eth1"]
    - endpoints: ["R2:eth2","R3:eth2"]
    - endpoints: ["R3:eth1","R4:eth1"]
    - endpoints: ["R3:eth3","R5:eth3"]
    - endpoints: ["R4:eth2","R6:eth2"]
    - endpoints: ["R6:eth1","R5:eth1"]
    - endpoints: ["R3:eth4","br-univ:eth1"]
    - endpoints: ["R7:eth4","br-univ:eth2"]
    - endpoints: ["R8:eth4","br-univ:eth3"]
