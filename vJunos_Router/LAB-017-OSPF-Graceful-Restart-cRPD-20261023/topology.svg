<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#64748b" flood-opacity="0.18"/></filter>
  <style>
    .title{font:700 34px 'DejaVu Sans',sans-serif;fill:#0f172a}.sub{font:400 17px 'DejaVu Sans',sans-serif;fill:#475569}
    .nodeTitle{font:700 23px 'DejaVu Sans',sans-serif;fill:#0f172a}.rid{font:500 15px 'DejaVu Sans',sans-serif;fill:#475569}
    .label{font:700 14px 'DejaVu Sans',sans-serif;fill:#0f172a}.small{font:400 12.5px 'DejaVu Sans',sans-serif;fill:#334155}
    .edge{stroke:#64748b;stroke-width:4;fill:none;stroke-linecap:round}.edge2{stroke:#2563eb;stroke-width:4.5;fill:none;stroke-linecap:round}
    .panelTitle{font:700 20px 'DejaVu Sans',sans-serif;fill:#0f172a}.panelText{font:400 15px 'DejaVu Sans',sans-serif;fill:#334155}
  </style>
</defs>
<rect width="1500" height="1050" fill="url(#bg)"/>
<text x="70" y="70" class="title">LAB-017 — OSPF Graceful Restart</text>
<text x="70" y="105" class="sub">R2 is the restarting router; R1 and R4 observe helper behavior across the Area 0 P2P diamond</text>
<!-- Four P2P links in diamond shape -->
<path d="M 880 245 L 1040 430" class="edge2"/>
<path d="M 620 245 L 460 430" class="edge"/>
<path d="M 1040 515 L 880 700" class="edge"/>
<path d="M 460 515 L 620 700" class="edge"/>
<!-- link labels -->
<g><rect x="880" y="300" width="300" height="70" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="1030" y="323" class="label" text-anchor="middle">R1–R2 · VLAN 12 · Area 0</text><text x="1030" y="345" class="small" text-anchor="middle">eth1.12 · R1 .1 / R2 .2</text><text x="1030" y="361" class="small" text-anchor="middle">10.0.12.0/30</text></g>
<g><rect x="320" y="300" width="300" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="470" y="323" class="label" text-anchor="middle">R1–R3 · VLAN 13 · Area 0</text><text x="470" y="345" class="small" text-anchor="middle">eth1.13 · R1 .1 / R3 .2</text><text x="470" y="361" class="small" text-anchor="middle">10.0.13.0/30</text></g>
<g><rect x="880" y="570" width="300" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="1030" y="593" class="label" text-anchor="middle">R2–R4 · VLAN 24 · Area 0</text><text x="1030" y="615" class="small" text-anchor="middle">eth1.24 · R2 .1 / R4 .2</text><text x="1030" y="631" class="small" text-anchor="middle">10.0.24.0/30</text></g>
<g><rect x="320" y="570" width="300" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="470" y="593" class="label" text-anchor="middle">R3–R4 · VLAN 34 · Area 0</text><text x="470" y="615" class="small" text-anchor="middle">eth1.34 · R3 .1 / R4 .2</text><text x="470" y="631" class="small" text-anchor="middle">10.0.34.0/30</text></g>
<!-- router nodes -->
<g filter="url(#shadow)"><rect x="620" y="145" width="260" height="130" rx="20" fill="url(#node)" stroke="#2563eb" stroke-width="3"/><rect x="1010" y="390" width="260" height="130" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><rect x="620" y="675" width="260" height="130" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/><rect x="230" y="390" width="260" height="130" rx="20" fill="url(#node)" stroke="#64748b" stroke-width="2.5"/></g>
<!-- icons -->
<g stroke="#2563eb" stroke-width="3" fill="none"><circle cx="675" cy="186" r="15"/><path d="M660 186h30M675 171v30M665 176l20 20M685 176l-20 20"/></g>
<g stroke="#ea580c" stroke-width="3" fill="none"><circle cx="1065" cy="431" r="15"/><path d="M1050 431h30M1065 416v30M1055 421l20 20M1075 421l-20 20"/></g>
<g stroke="#16a34a" stroke-width="3" fill="none"><circle cx="675" cy="716" r="15"/><path d="M660 716h30M675 701v30M665 706l20 20M685 706l-20 20"/></g>
<g stroke="#64748b" stroke-width="3" fill="none"><circle cx="285" cy="431" r="15"/><path d="M270 431h30M285 416v30M275 421l20 20M295 421l-20 20"/></g>
<text x="710" y="187" class="nodeTitle">R1</text><text x="710" y="214" class="rid">RID 10.1.1.1</text><text x="650" y="253" class="small">Helper observer</text>
<text x="1100" y="432" class="nodeTitle">R2</text><text x="1100" y="459" class="rid">RID 10.1.1.2</text><text x="1050" y="495" style="font:700 13px 'DejaVu Sans';fill:#c2410c">GR RESTART TARGET</text>
<text x="710" y="717" class="nodeTitle">R4</text><text x="710" y="744" class="rid">RID 10.1.1.4</text><text x="650" y="785" class="small">Helper observer</text>
<text x="320" y="432" class="nodeTitle">R3</text><text x="320" y="459" class="rid">RID 10.1.1.3</text><text x="260" y="495" class="small">Alternate path</text>
<!-- central area tag -->
<rect x="625" y="420" width="300" height="72" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="775" y="448" style="font:700 20px 'DejaVu Sans';fill:#1d4ed8" text-anchor="middle">OSPF Area 0</text><text x="775" y="472" class="small" text-anchor="middle">Four point-to-point links</text>
<!-- bottom notes -->
<rect x="70" y="855" width="1360" height="135" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="105" y="891" class="panelTitle">Lab intent</text>
<text x="105" y="921" class="panelText">• Enable OSPF GR on R2, then restart the routing process (rpd) using the operational command.</text>
<text x="105" y="949" class="panelText">• Observe R2's pre-restart Router-LSA and routes from R1/R4. Helper evidence matters more than config alone.</text>
<text x="105" y="977" class="panelText">• cRPD control-plane verification only; do not claim PFE/data-plane continuity. Remove LAB-016 BFD first.</text>
</svg>