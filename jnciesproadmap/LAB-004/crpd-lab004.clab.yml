name: lab004-crpd
prefix: ""

mgmt:
  network: lab004-crpd-mgmt
  ipv4-subnet: 172.31.4.0/24

topology:
  defaults:
    enforce-startup-config: true

  nodes:
    r1:
      kind: juniper_crpd
      image: xzjt/crpd:25.2R1-S1.4
      startup-config: configs_crpd/r1.conf
      mgmt-ipv4: 172.31.4.11

    r2:
      kind: juniper_crpd
      image: xzjt/crpd:25.2R1-S1.4
      startup-config: configs_crpd/r2.conf
      mgmt-ipv4: 172.31.4.12

    r3:
      kind: juniper_crpd
      image: xzjt/crpd:25.2R1-S1.4
      startup-config: configs_crpd/r3.conf
      mgmt-ipv4: 172.31.4.13

    r4:
      kind: juniper_crpd
      image: xzjt/crpd:25.2R1-S1.4
      startup-config: configs_crpd/r4.conf
      mgmt-ipv4: 172.31.4.14

    klien1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      mgmt-ipv4: 172.31.4.21
      exec:
        - ip address add 192.168.40.10/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.0.0.0/8 via 192.168.40.1
        - ip route add 198.51.100.0/24 via 192.168.40.1

    server1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      mgmt-ipv4: 172.31.4.22
      exec:
        - ip address add 198.51.100.10/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.0.0.0/8 via 198.51.100.1
        - ip route add 192.168.40.0/24 via 198.51.100.1

  links:
    - endpoints: ["klien1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r1:eth3", "r3:eth1"]
    - endpoints: ["r3:eth2", "r4:eth2"]
    - endpoints: ["r4:eth3", "server1:eth1"]
