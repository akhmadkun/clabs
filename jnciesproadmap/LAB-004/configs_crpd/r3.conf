system {
    host-name R3;
    root-authentication {
        encrypted-password "$6$LAB001Junos$qHr8CuT1soYYP/DDM94IlOxaX7UJsbvffksxbWalvkylwQGrJsEdwGdYwtZjCYYybd6t0q0xDQxhW63oCbuog0";
    }
    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$LAB001Junos$qHr8CuT1soYYP/DDM94IlOxaX7UJsbvffksxbWalvkylwQGrJsEdwGdYwtZjCYYybd6t0q0xDQxhW63oCbuog0";
            }
        }
    }
    services {
        ssh {
            root-login allow;
        }
        netconf {
            ssh;
        }
    }
    time-zone Asia/Jakarta;
    management-instance;
    syslog {
        file messages {
            any notice;
            authorization info;
        }
        file interactive-commands {
            interactive-commands any;
        }
    }
}
interfaces {
    eth1 {
        description R3-TO-R1-BACKUP;
        unit 0 {
            family inet {
                address 10.0.13.2/30;
            }
            family mpls;
        }
    }
    eth2 {
        description R3-TO-R4-BACKUP;
        unit 0 {
            family inet {
                address 10.0.34.1/30;
            }
            family mpls;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.4.3/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.4.3;
    autonomous-system 65000;
}
protocols {
    mpls {
        interface eth1;
        interface eth2;
    }
    ldp {
        transport-address router-id;
        interface eth1;
        interface eth2;
        interface lo0.0;
    }
    ospf {
        traffic-engineering;
        area 0.0.0.0 {
            interface eth1 {
                interface-type p2p;
                metric 50;
            }
            interface eth2 {
                interface-type p2p;
                metric 50;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
}
