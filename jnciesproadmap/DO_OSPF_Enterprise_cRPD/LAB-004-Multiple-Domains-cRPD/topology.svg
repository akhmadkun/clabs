<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs>
 <style>
 text{font-family:Inter,Arial,sans-serif;fill:#17212f} .title{font-size:38px;font-weight:700}.subtitle{font-size:21px;fill:#536273}
 .areaTitle{font-size:25px;font-weight:700}.areaSub{font-size:17px;fill:#465568}.rt{font-size:23px;font-weight:700}.desc{font-size:17px;fill:#425166}.if{font-size:17px;font-weight:600}.ip{font-size:16px;fill:#334155}.vlan{font-size:18px;font-weight:700}.tiny{font-size:15px;fill:#475569}
 .edge{fill:none;stroke-width:5;stroke-linecap:round}.edge2{fill:none;stroke-width:4;stroke-linecap:round}
 </style>
 <g id="router"><ellipse cx="0" cy="9" rx="48" ry="13" fill="#075985"/><path d="M-48,9 L-48,-18 C-48,-37 48,-37 48,-18 L48,9 C48,28 -48,28 -48,9Z" fill="#0284c7" stroke="#075985" stroke-width="2"/><path d="M-27,-18 l18,0 -8,-8 M-9,-18 l-8,8 M8,-17 l19,0 -8,-8 M27,-17 l-8,8 M-24,5 l0,-16 -8,8 M-24,-11 l8,8 M23,-11 l0,16 -8,-8 M23,5 l-8,-8" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
 <g id="pc"><rect x="-28" y="-22" width="56" height="40" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><rect x="-21" y="-15" width="42" height="26" fill="#f8fafc" stroke="#94a3b8"/><path d="M0 18 v9 M-12 28 h24" stroke="#475569" stroke-width="4" stroke-linecap="round"/></g>
</defs>
<rect width="1800" height="1120" fill="#ffffff"/>
<text x="900" y="56" text-anchor="middle" class="title">LAB-004 - Multiple Homogeneous OSPF Domains</text>
<text x="900" y="89" text-anchor="middle" class="subtitle">Logical topology • cRPD 25.2R1-S1.4 • 802.1Q VLAN subinterfaces • bridge omitted intentionally</text>
<!-- Domain 1 panels -->
<rect x="35" y="125" width="1050" height="540" rx="24" fill="#f2f8ff" stroke="#93c5fd" stroke-width="2"/>
<text x="65" y="163" class="areaTitle" fill="#1d4ed8">DOMAIN 1 - default instance / inet.0</text>
<rect x="75" y="190" width="540" height="205" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
<text x="95" y="222" class="areaTitle" fill="#1d4ed8">Area 0 (Backbone)</text>
<rect x="75" y="420" width="320" height="190" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
<text x="95" y="452" class="areaTitle" fill="#166534">Area 1</text>
<rect x="430" y="420" width="370" height="190" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
<text x="450" y="452" class="areaTitle" fill="#92400e">Area 2</text>
<!-- Domain 2 panel -->
<rect x="1110" y="125" width="655" height="540" rx="24" fill="#f7f2ff" stroke="#c4b5fd" stroke-width="2"/>
<text x="1140" y="163" class="areaTitle" fill="#6d28d9">DOMAIN 2 - routing-instance domain2</text>
<rect x="1145" y="190" width="585" height="205" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
<text x="1165" y="222" class="areaTitle" fill="#1d4ed8">Area 0 (Backbone)</text>
<rect x="1145" y="420" width="585" height="190" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
<text x="1165" y="452" class="areaTitle" fill="#166534">Area 1</text>
<!-- Domain1 router positions R1 220,300 R2 520,300 R3 220,520 R4 650,520 -->
<!-- link R1-R2 -->
<path d="M268 300 H472" class="edge" stroke="#2563eb"/>
<rect x="315" y="263" width="110" height="31" rx="10" fill="#ffffff" stroke="#93c5fd"/>
<text x="370" y="284" text-anchor="middle" class="vlan" fill="#1d4ed8">VLAN 12</text>
<text x="370" y="324" text-anchor="middle" class="ip">10.0.12.0/24</text>
<text x="295" y="350" class="if">eth1.12</text><text x="410" y="350" class="if">eth1.12</text>
<use href="#router" x="220" y="300"/><text x="220" y="357" text-anchor="middle" class="rt">R1</text><text x="220" y="382" text-anchor="middle" class="ip">Lo0 10.1.1.1/32</text>
<use href="#router" x="520" y="300"/><text x="520" y="357" text-anchor="middle" class="rt">R2</text><text x="520" y="382" text-anchor="middle" class="ip">Lo0 10.1.1.2/32</text>
<!-- R1-R3 -->
<path d="M220 328 V492" class="edge" stroke="#16a34a"/>
<rect x="235" y="390" width="122" height="31" rx="9" fill="#fff" stroke="#86efac"/><text x="296" y="411" text-anchor="middle" class="vlan" fill="#166534">VLAN 13</text>
<text x="235" y="446" class="ip">10.0.13.0/24</text><text x="235" y="470" class="if">eth1.13</text>
<use href="#router" x="220" y="520"/><text x="220" y="577" text-anchor="middle" class="rt">R3</text><text x="220" y="601" text-anchor="middle" class="ip">Lo0 10.1.1.3/32</text>
<!-- R2-R4 -->
<path d="M520 328 V492 H650" class="edge" stroke="#d97706"/>
<rect x="550" y="378" width="122" height="31" rx="9" fill="#fff" stroke="#fcd34d"/><text x="611" y="399" text-anchor="middle" class="vlan" fill="#92400e">VLAN 24</text>
<text x="563" y="431" class="ip">10.0.24.0/24</text><text x="563" y="456" class="if">eth1.24</text>
<use href="#router" x="650" y="520"/><text x="650" y="577" text-anchor="middle" class="rt">R4</text><text x="650" y="601" text-anchor="middle" class="ip">Lo0 10.1.1.4/32</text>
<!-- R4 endpoint networks text cards -->
<rect x="825" y="425" width="235" height="185" rx="14" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
<text x="842" y="455" class="vlan" fill="#92400e">R4 passive interfaces</text>
<text x="842" y="485" class="ip">eth2.0  192.168.16.1/30</text>
<text x="842" y="515" class="ip">eth3.0  192.168.17.1/24</text>
<text x="842" y="545" class="ip">eth4.0  192.168.18.1/23</text>
<text x="842" y="580" class="tiny">EP16 / EP17 / EP18</text>
<!-- Domain2 R1 virtual instance attachment to R6 -->
<use href="#router" x="1250" y="300"/><text x="1250" y="357" text-anchor="middle" class="rt">R1</text><text x="1250" y="382" text-anchor="middle" class="ip">domain2 RID 10.2.1.1</text>
<use href="#router" x="1580" y="300"/><text x="1580" y="357" text-anchor="middle" class="rt">R6</text><text x="1580" y="382" text-anchor="middle" class="ip">Lo0 10.1.1.6/32</text>
<path d="M1298 300 H1532" class="edge" stroke="#7c3aed"/>
<rect x="1370" y="263" width="120" height="31" rx="9" fill="#fff" stroke="#c4b5fd"/><text x="1430" y="284" text-anchor="middle" class="vlan" fill="#6d28d9">VLAN 56</text>
<text x="1430" y="324" text-anchor="middle" class="ip">10.0.56.0/30</text>
<text x="1322" y="350" class="if">eth1.56</text><text x="1470" y="350" class="if">eth1.56</text>
<!-- Domain2 R6-R7 -->
<path d="M1580 328 V492" class="edge" stroke="#16a34a"/>
<rect x="1595" y="385" width="120" height="31" rx="9" fill="#fff" stroke="#86efac"/><text x="1655" y="406" text-anchor="middle" class="vlan" fill="#166534">VLAN 67</text>
<text x="1600" y="440" class="ip">10.0.67.4/30</text><text x="1600" y="465" class="if">eth1.67</text>
<use href="#router" x="1580" y="520"/><text x="1580" y="577" text-anchor="middle" class="rt">R7</text><text x="1580" y="601" text-anchor="middle" class="ip">lo0.0: 10.1.1.7/32</text>
<text x="1580" y="630" text-anchor="middle" class="tiny">same lo0.0: 172.19.21.1/32 • 172.19.22.1/32</text>
<!-- center crossing link visual route-policy conceptual -->
<path d="M1085 300 H1109" stroke="#64748b" stroke-width="3" stroke-dasharray="5 5"/>
<text x="1096" y="285" text-anchor="middle" class="tiny">RIB</text>
<!-- endpoints section -->
<rect x="35" y="700" width="1730" height="165" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="65" y="740" class="areaTitle">Route-sharing workflow on R1</text>
<rect x="65" y="765" width="470" height="70" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
<text x="300" y="793" text-anchor="middle" class="vlan">RIB group sharing</text><text x="300" y="818" text-anchor="middle" class="ip">inet.0 → domain2.inet.0</text>
<path d="M540 800 H620" class="edge2" stroke="#64748b"/><path d="M610 791 l12 9 -12 9" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="630" y="765" width="470" height="70" rx="12" fill="#ede9fe" stroke="#c4b5fd"/>
<text x="865" y="793" text-anchor="middle" class="vlan">RIB group sharing2</text><text x="865" y="818" text-anchor="middle" class="ip">domain2.inet.0 → inet.0</text>
<path d="M1105 800 H1185" class="edge2" stroke="#64748b"/><path d="M1175 791 l12 9 -12 9" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="1195" y="765" width="530" height="70" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
<text x="1460" y="793" text-anchor="middle" class="vlan">OSPF export policies</text><text x="1460" y="818" text-anchor="middle" class="ip">tag 10: Domain 2 → 1 | tag 11: Domain 1 → 2</text>
<text x="900" y="920" text-anchor="middle" class="subtitle">Verify independently: show ospf neighbor instance domain2 • show route table domain2.inet.0 • show ospf database external</text>
<text x="900" y="964" text-anchor="middle" class="tiny">Note: Area labels describe OSPF membership; VLAN IDs describe L2 logical segments over the shared physical bridge.</text>
</svg>