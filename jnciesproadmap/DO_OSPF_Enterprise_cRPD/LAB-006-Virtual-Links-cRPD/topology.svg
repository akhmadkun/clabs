<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#25364a" flood-opacity="0.13"/></filter>
  <style>
    text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#172b3a}
    .title{font-size:32px;font-weight:750;letter-spacing:.3px}
    .subtitle{font-size:16px;fill:#5b6b78}
    .areatitle{font-size:21px;font-weight:750}
    .small{font-size:14px;fill:#435766}
    .label{font-size:15px;font-weight:650}
    .router{font-size:18px;font-weight:750}
    .routerid{font-size:13px;fill:#5b6b78}
    .ip{font-size:14px;fill:#263d4e}
    .host{font-size:16px;font-weight:700}
    .line{fill:none;stroke:#2c536b;stroke-width:4;stroke-linecap:round}
    .p2p{fill:none;stroke:#238a78;stroke-width:4;stroke-linecap:round}
    .vl{fill:none;stroke:#a855c7;stroke-width:4;stroke-linecap:round;stroke-dasharray:11 9}
    .card{fill:#fff;stroke:#cad5df;stroke-width:1.4;filter:url(#shadow)}
    .callout{fill:#fff;stroke:#c8d4df;stroke-width:1.3}
  </style>
</defs>
<rect width="1680" height="1000" fill="#ffffff"/>
<text x="60" y="58" class="title">LAB-006 | OSPF VIRTUAL LINKS</text>
<text x="60" y="88" class="subtitle">Logical topology reference • bridge omitted • cRPD / 802.1Q subinterfaces</text>

<!-- Area regions -->
<rect x="275" y="115" width="770" height="195" rx="22" fill="#e8f3ff" stroke="#b8d8f6" stroke-width="2"/>
<text x="300" y="150" class="areatitle" fill="#165f91">Area 0 — Backbone</text>
<rect x="55" y="340" width="475" height="300" rx="22" fill="#edf9ef" stroke="#c3e7c9" stroke-width="2"/>
<text x="80" y="378" class="areatitle" fill="#247044">Area 1</text>
<rect x="585" y="330" width="720" height="330" rx="22" fill="#fff6e6" stroke="#f3d69e" stroke-width="2"/>
<text x="610" y="368" class="areatitle" fill="#94600a">Area 2 — Transit Area</text>
<rect x="1255" y="330" width="365" height="330" rx="22" fill="#f7edfc" stroke="#ddc2ee" stroke-width="2"/>
<text x="1280" y="368" class="areatitle" fill="#7d3ca0">Area 3</text>

<!-- Physical/logical links first -->
<path d="M 440 220 L 820 220" class="line"/>
<path d="M 385 260 C 360 345 300 425 250 485" class="p2p"/>
<path d="M 875 260 L 875 425" class="p2p"/>
<path d="M 930 475 L 1105 475" class="p2p"/>
<path d="M 1190 475 L 1335 430" stroke="#a855c7" stroke-width="3" fill="none"/>
<path d="M 1190 495 L 1335 550" stroke="#a855c7" stroke-width="3" fill="none"/>

<!-- Virtual link curved logical overlay -->
<path d="M 850 182 C 910 115 1108 125 1164 250 C 1200 333 1183 381 1147 438" class="vl"/>
<rect x="1010" y="150" width="390" height="90" rx="14" fill="#fff" stroke="#d9b6e9" stroke-width="1.8" filter="url(#shadow)"/>
<text x="1030" y="180" class="label" fill="#823da0">Virtual link (configured in Task 4)</text>
<text x="1030" y="204" class="small">R2 RID 10.1.1.2 ↔ R10 RID 10.1.1.10</text>
<text x="1030" y="225" class="small">Transit Area 2 (0.0.0.2)</text>

<!-- Link labels -->
<rect x="505" y="164" width="285" height="88" rx="12" class="callout"/>
<text x="647" y="184" text-anchor="middle" class="label">VLAN 12 • Area 0</text>
<text x="647" y="205" text-anchor="middle" class="small">R1 eth1.12 ↔ R2 eth1.12</text>
<text x="647" y="225" text-anchor="middle" class="small">10.0.12.0/24 • broadcast</text>
<text x="647" y="243" text-anchor="middle" class="small">DR/BDR review</text>
<rect x="160" y="355" width="295" height="82" rx="12" class="callout"/>
<text x="307" y="375" text-anchor="middle" class="label">VLAN 13 • Area 1</text>
<text x="307" y="396" text-anchor="middle" class="small">R1 eth1.13 ↔ R3 eth1.13</text>
<text x="307" y="418" text-anchor="middle" class="small">10.0.13.0/30 • point-to-point</text>
<rect x="920" y="297" width="235" height="70" rx="12" class="callout"/>
<text x="1037" y="316" text-anchor="middle" class="label">VLAN 24 • Area 2</text>
<text x="1037" y="337" text-anchor="middle" class="small">R2/R4 eth1.24</text>
<text x="1037" y="356" text-anchor="middle" class="small">10.0.24.0/30 • P2P</text>
<rect x="938" y="366" width="190" height="58" rx="10" class="callout"/>
<text x="1033" y="386" text-anchor="middle" class="label" style="font-size:13px">VLAN 410 • Area 2</text>
<text x="1033" y="405" text-anchor="middle" class="small" style="font-size:12px">eth1.410 ↔ eth1.410</text>
<text x="1033" y="419" text-anchor="middle" class="small" style="font-size:11px">10.0.41.0/30 • P2P</text>

<!-- Routers -->
<g transform="translate(385 220)">
 <circle r="47" fill="#236d9b" stroke="#fff" stroke-width="3" filter="url(#shadow)"/>
 <path d="M-24 -18 L-5 -18 L-5 -31 L20 -7 L-5 17 L-5 3 L-24 3 Z M24 18 L5 18 L5 31 L-20 7 L5 -17 L5 -3 L24 -3 Z" fill="#fff" opacity=".92" transform="scale(.75)"/>
 <text x="0" y="70" text-anchor="middle" class="router">R1</text>
 <text x="0" y="90" text-anchor="middle" class="routerid">RID 10.1.1.1</text>
</g>
<g transform="translate(875 220)">
 <circle r="47" fill="#236d9b" stroke="#fff" stroke-width="3" filter="url(#shadow)"/>
 <path d="M-24 -18 L-5 -18 L-5 -31 L20 -7 L-5 17 L-5 3 L-24 3 Z M24 18 L5 18 L5 31 L-20 7 L5 -17 L5 -3 L24 -3 Z" fill="#fff" opacity=".92" transform="scale(.75)"/>
 <text x="0" y="70" text-anchor="middle" class="router">R2 (ABR)</text>
 <text x="0" y="90" text-anchor="middle" class="routerid">RID 10.1.1.2</text>
</g>
<g transform="translate(220 510)">
 <circle r="43" fill="#236d9b" stroke="#fff" stroke-width="3" filter="url(#shadow)"/>
 <path d="M-24 -18 L-5 -18 L-5 -31 L20 -7 L-5 17 L-5 3 L-24 3 Z M24 18 L5 18 L5 31 L-20 7 L5 -17 L5 -3 L24 -3 Z" fill="#fff" opacity=".92" transform="scale(.72)"/>
 <text x="0" y="66" text-anchor="middle" class="router">R3</text>
 <text x="0" y="86" text-anchor="middle" class="routerid">RID 10.1.1.3</text>
</g>
<g transform="translate(875 470)">
 <circle r="45" fill="#236d9b" stroke="#fff" stroke-width="3" filter="url(#shadow)"/>
 <path d="M-24 -18 L-5 -18 L-5 -31 L20 -7 L-5 17 L-5 3 L-24 3 Z M24 18 L5 18 L5 31 L-20 7 L5 -17 L5 -3 L24 -3 Z" fill="#fff" opacity=".92" transform="scale(.72)"/>
 <text x="0" y="68" text-anchor="middle" class="router">R4</text>
 <text x="0" y="88" text-anchor="middle" class="routerid">Transit router • RID 10.1.1.4</text>
</g>
<g transform="translate(1155 475)">
 <circle r="45" fill="#7d55a6" stroke="#fff" stroke-width="3" filter="url(#shadow)"/>
 <path d="M-24 -18 L-5 -18 L-5 -31 L20 -7 L-5 17 L-5 3 L-24 3 Z M24 18 L5 18 L5 31 L-20 7 L5 -17 L5 -3 L24 -3 Z" fill="#fff" opacity=".92" transform="scale(.72)"/>
 <text x="0" y="68" text-anchor="middle" class="router">R10 (ABR)</text>
 <text x="0" y="88" text-anchor="middle" class="routerid">RID 10.1.1.10</text>
</g>

<!-- Router/host IP details -->
<rect x="70" y="690" width="480" height="210" rx="16" fill="#f7fafc" stroke="#d6e0e8"/>
<text x="94" y="725" class="label">Area 2 prefixes behind R4</text>
<text x="94" y="754" class="ip">eth2.0  192.168.16.1/30  → EP16 192.168.16.2/30</text>
<text x="94" y="782" class="ip">eth3.0  192.168.17.1/24  → EP17 192.168.17.2/24</text>
<text x="94" y="810" class="ip">eth4.0  192.168.18.1/23  → EP18 192.168.18.2/23</text>
<text x="94" y="855" class="small">Advertise R4 host-facing interfaces passively in Area 2.</text>

<!-- Area 3 endpoints -->
<g transform="translate(1410 420)">
 <rect x="-60" y="-34" width="120" height="78" rx="12" fill="#fff" stroke="#d4c0e5" stroke-width="1.5" filter="url(#shadow)"/>
 <rect x="-24" y="-20" width="48" height="28" rx="3" fill="#e8f3fb" stroke="#4f7691" stroke-width="2"/>
 <path d="M-30 14 H30 M-8 8 L-12 14 M8 8 L12 14" stroke="#4f7691" stroke-width="2" fill="none"/>
 <text x="0" y="66" text-anchor="middle" class="host">EP76</text>
 <text x="0" y="87" text-anchor="middle" class="ip">192.168.76.2/24</text>
</g>
<g transform="translate(1410 555)">
 <rect x="-60" y="-34" width="120" height="78" rx="12" fill="#fff" stroke="#d4c0e5" stroke-width="1.5" filter="url(#shadow)"/>
 <rect x="-24" y="-20" width="48" height="28" rx="3" fill="#e8f3fb" stroke="#4f7691" stroke-width="2"/>
 <path d="M-30 14 H30 M-8 8 L-12 14 M8 8 L12 14" stroke="#4f7691" stroke-width="2" fill="none"/>
 <text x="0" y="66" text-anchor="middle" class="host">EP77</text>
 <text x="0" y="87" text-anchor="middle" class="ip">192.168.77.2/24</text>
</g>
<rect x="650" y="700" width="900" height="190" rx="16" fill="#fbf7fe" stroke="#dfcaed"/>
<text x="678" y="738" class="label" fill="#823da0">Virtual-link learning checkpoints</text>
<text x="678" y="770" class="ip">Before: R2/R1 have no active OSPF route to 192.168.76.0/24 and 192.168.77.0/24.</text>
<text x="678" y="800" class="ip">After: virtual adjacency R2 ↔ R10 is Full through normal transit Area 2.</text>
<text x="678" y="830" class="ip">Then: Area 3 routes become visible as OSPF inter-area routes in the backbone.</text>
<text x="678" y="862" class="small">R2 and R10 are virtual-link endpoints / ABRs; R4 is the transit router in Area 2.</text>

<text x="60" y="957" class="small">Addressing startup configs only • Configure router IDs, OSPF areas, passive interfaces, and virtual-link statements during the lab.</text>
</svg>