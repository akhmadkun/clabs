name: lab003
prefix: ""

mgmt:
  network: lab003-mgmt
  ipv4-subnet: 172.31.3.0/24

topology:
  kinds:
    juniper_vjunosrouter:
      image: vrnetlab/juniper_vjunos-router:25.4R1.12
      enforce-startup-config: true

  nodes:
    r1: # lo0: 10.0.255.1/32
      kind: juniper_vjunosrouter
      startup-config: configs/r1.conf
      mgmt-ipv4: 172.31.3.11
    r2: # lo0: 10.0.255.2/32
      kind: juniper_vjunosrouter
      startup-config: configs/r2.conf
      mgmt-ipv4: 172.31.3.12
    r3: # lo0: 10.0.255.3/32
      kind: juniper_vjunosrouter
      startup-config: configs/r3.conf
      mgmt-ipv4: 172.31.3.13
    r4: # lo0: 10.0.255.4/32
      kind: juniper_vjunosrouter
      startup-config: configs/r4.conf
      mgmt-ipv4: 172.31.3.14
    client1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      mgmt-ipv4: 172.31.3.21
      exec:
        - ip address add 192.168.30.10/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.0.0.0/8 via 192.168.30.1

  links:
    - endpoints: ["client1:eth1", "r1:ge-0/0/0"]
    - endpoints: ["r1:ge-0/0/1", "r2:ge-0/0/0"] # 10.0.12.0/30
    - endpoints: ["r2:ge-0/0/1", "r3:ge-0/0/0"] # 10.0.23.0/30
    - endpoints: ["r3:ge-0/0/1", "r4:ge-0/0/0"] # 10.0.34.0/30
