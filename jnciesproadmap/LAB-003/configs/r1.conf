        unit 0 {
            family inet {
                address 10.0.12.1/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.1/32;
            }
        }
    }
}
routing-options {
    static {
        route 10.0.23.0/30 next-hop 10.0.12.2;
        route 10.0.34.0/30 next-hop 10.0.12.2;
        route 10.255.0.2/32 next-hop 10.0.12.2;
