name: lab002
prefix: ""

mgmt:
  network: lab002-mgmt
  ipv4-subnet: 172.31.2.0/24

topology:
  kinds:
    juniper_vjunosrouter:
      image: vrnetlab/juniper_vjunos-router:25.4R1.12
      enforce-startup-config: true

  nodes:
    r1:
      kind: juniper_vjunosrouter
      startup-config: configs/r1.conf
      mgmt-ipv4: 172.31.2.11
    r2:
      kind: juniper_vjunosrouter
      startup-config: configs/r2.conf
      mgmt-ipv4: 172.31.2.12
    r3:
      kind: juniper_vjunosrouter
      startup-config: configs/r3.conf
      mgmt-ipv4: 172.31.2.13
    client1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      mgmt-ipv4: 172.31.2.21
      exec:
        - ip address add 192.168.20.10/24 dev eth1
        - ip link set eth1 up
        - ip route add 10.255.0.0/24 via 192.168.20.1
        - ip route add 10.0.12.0/30 via 192.168.20.1
        - ip route add 10.0.13.0/30 via 192.168.20.1

  links:
    - endpoints: ["client1:eth1", "r1:ge-0/0/0"]
    - endpoints: ["r1:ge-0/0/1", "r2:ge-0/0/0"]
    - endpoints: ["r1:ge-0/0/2", "r3:ge-0/0/0"]
