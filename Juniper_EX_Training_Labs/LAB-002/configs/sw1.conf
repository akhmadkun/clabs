system {
    host-name EX-TRAIN-SW1;
}

chassis {
    aggregated-devices {
        ethernet {
            device-count 1;
        }
    }
}

vlans {
    USERS {
        vlan-id 10;
    }
}

interfaces {
    ge-0/0/0 {
        description HOST1-ACCESS;
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members USERS;
                }
            }
        }
    }

    ge-0/0/1 {
        description LACP-MEMBER-1-TO-SW2;
    }

    ge-0/0/2 {
        description LACP-MEMBER-2-TO-SW2;
    }
}
