system {
    host-name EX-TRAIN-SW1;
}

vlans {
    USERS {
        vlan-id 10;
    }
}

interfaces {
    ge-0/0/0 {
        description HOST1-ACCESS;
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members USERS;
                }
            }
        }
    }

    ge-0/0/1 {
        description SW2-TRUNK;
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members USERS;
                }
            }
        }
    }
}
