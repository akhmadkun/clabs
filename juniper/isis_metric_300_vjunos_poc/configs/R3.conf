system {
    host-name R3;
}

routing-options {
    router-id 3.3.3.3;
}

interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.23.2/30;
            }
            family iso;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 3.3.3.3/32;
            }
            family iso {
                address 49.0001.0000.0000.0003.00;
            }
        }
    }
}

protocols {
    isis {
        interface lo0.0 {
            passive;
        }
        interface ge-0/0/0.0 {
            level 1 {
                disable;
            }
            level 2 {
                metric 10;
            }
        }
    }
}
