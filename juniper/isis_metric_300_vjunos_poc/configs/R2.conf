system {
    host-name R2;
}

routing-options {
    router-id 2.2.2.2;
}

interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.12.2/30;
            }
            family iso;
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.0.23.1/30;
            }
            family iso;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 2.2.2.2/32;
            }
            family iso {
                address 49.0001.0000.0000.0002.00;
            }
        }
    }
}

protocols {
    isis {
        interface lo0.0 {
            passive;
        }
        interface ge-0/0/0.0 {
            level 1 {
                disable;
            }
            level 2 {
                metric 10;
            }
        }
        interface ge-0/0/1.0 {
            level 1 {
                disable;
            }
            level 2 {
                metric 300;
            }
        }
    }
}
