<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">BGP iBGP Full Mesh Topology</title>
  <desc id="desc">Topology with customer edge R1 in AS 65001, provider routers R2 through R5 in AS 65000, and customer edge R6 in AS 65006.</desc>
  <defs>
    <linearGradient id="routerBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dedede"/></linearGradient>
    <linearGradient id="asOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2df"/><stop offset="1" stop-color="#fff0e7"/></linearGradient>
    <linearGradient id="asGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f1df"/><stop offset="1" stop-color="#eaf2dd"/></linearGradient>
    <linearGradient id="asPink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0caca"/><stop offset="1" stop-color="#efc4c7"/></linearGradient>
    <g id="router">
      <ellipse cx="0" cy="12" rx="29" ry="11" fill="#bcbcbc" stroke="#3d3d3d" stroke-width="1.5"/>
      <path d="M-29,-2 C-29,-17 -16,-25 0,-25 C16,-25 29,-17 29,-2 L29,12 C29,24 16,30 0,30 C-16,30 -29,24 -29,12 Z" fill="url(#routerBody)" stroke="#454545" stroke-width="1.7"/>
      <ellipse cx="0" cy="-2" rx="29" ry="18" fill="#f8f8f8" stroke="#454545" stroke-width="1.7"/>
      <g fill="none" stroke="#c92b27" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-17,-9 L-4,-2 L-12,3 M-4,-2 L-8,-12"/>
        <path d="M17,-9 L4,-2 L12,3 M4,-2 L8,-12"/>
        <path d="M-16,9 L-4,3 L-10,15 M-4,3 L-13,2"/>
        <path d="M16,9 L4,3 L10,15 M4,3 L13,2"/>
      </g>
    </g>
    <style>
      .node-name{font: 700 18px Arial,Helvetica,sans-serif; fill:#202020; text-anchor:middle}
      .role{font: 16px Arial,Helvetica,sans-serif; fill:#3a83a2; text-anchor:middle}
      .area-label{font: 700 27px Arial,Helvetica,sans-serif; fill:#9c6a33; text-anchor:middle}
      .area-label-green{font: 700 25px Arial,Helvetica,sans-serif; fill:#66784c; text-anchor:middle}
      .area-label-pink{font: 700 25px Arial,Helvetica,sans-serif; fill:#96676a; text-anchor:middle}
      .interface{font: 16px Arial,Helvetica,sans-serif; fill:#333; text-anchor:middle}
      .bandwidth{font: 16px Arial,Helvetica,sans-serif; fill:#333; text-anchor:middle}
      .ibgp{font: 24px Arial,Helvetica,sans-serif; fill:#39b4cf; text-anchor:middle}
      .link{stroke:#171717; stroke-width:2.7; fill:none}
      .ibgp-link{stroke:#39b4cf; stroke-width:2.5; stroke-dasharray:14 10; fill:none; opacity:.9}
    </style>
  </defs>
  <rect width="1200" height="590" fill="#fff"/>
  <!-- AS regions -->
  <rect x="18" y="18" width="844" height="548" rx="3" fill="url(#asOrange)"/>
  <rect x="18" y="236" width="190" height="330" rx="3" fill="url(#asGreen)"/>
  <rect x="988" y="18" width="190" height="318" rx="3" fill="url(#asPink)"/>

  <!-- iBGP full-mesh sessions, drawn behind physical links and routers -->
  <g class="ibgp-link">
    <path d="M112,132 C280,-40 606,-32 770,132"/>
    <path d="M112,132 C250,190 435,386 770,435"/>
    <path d="M378,118 C505,5 638,27 770,132"/>
    <path d="M378,118 C474,238 596,382 770,435"/>
    <path d="M770,132 C825,235 826,338 770,435"/>
    <path d="M112,132 C190,98 285,97 378,118"/>
  </g>

  <!-- Physical links -->
  <g class="link">
    <path d="M112,132 L112,340"/>
    <path d="M112,132 L378,118"/>
    <path d="M378,118 L770,132"/>
    <path d="M770,132 L1082,132" stroke-width="6"/>
    <path d="M378,118 L770,435"/>
    <path d="M770,435 L1082,132" stroke="#555" stroke-width="1.5"/>
  </g>

  <!-- Router nodes -->
  <g transform="translate(112 132)"><use xlink:href="#router"/></g>
  <g transform="translate(112 340)"><use xlink:href="#router"/></g>
  <g transform="translate(378 118)"><use xlink:href="#router"/></g>
  <g transform="translate(770 132)"><use xlink:href="#router"/></g>
  <g transform="translate(770 435)"><use xlink:href="#router"/></g>
  <g transform="translate(1082 132)"><use xlink:href="#router"/></g>

  <!-- Router role / names -->
  <text class="role" x="112" y="69">PE</text><text class="node-name" x="112" y="166">R2</text>
  <text class="role" x="112" y="389">CE</text><text class="node-name" x="112" y="365">R1</text>
  <text class="role" x="378" y="56">P</text><text class="node-name" x="378" y="154">R3</text>
  <text class="role" x="770" y="69">PE</text><text class="node-name" x="770" y="166">R4</text>
  <text class="node-name" x="770" y="481">R5</text><text class="role" x="770" y="507">PE</text>
  <text class="role" x="1082" y="69">CE</text><text class="node-name" x="1082" y="166">R6</text>

  <!-- Interface and bandwidth labels -->
  <text class="interface" x="153" y="254">E0/1</text>
  <text class="interface" x="226" y="113">E0/2</text><text class="interface" x="310" y="109">E0/2</text>
  <text class="interface" x="490" y="112">E0/1</text><text class="interface" x="666" y="120">E0/1</text>
  <text class="bandwidth" x="928" y="119">2 Gbps</text>
  <text class="interface" x="560" y="278" transform="rotate(39 560 278)">E0/3</text>
  <text class="bandwidth" x="885" y="318" transform="rotate(-44 885 318)">1 Gbps</text>

  <!-- AS labels -->
  <text class="area-label-green" x="102" y="439"><tspan x="102" dy="0">BGP ASN</tspan><tspan x="102" dy="32">65001</tspan></text>
  <text class="area-label" x="375" y="316"><tspan x="375" dy="0">BGP ASN</tspan><tspan x="375" dy="32">65000</tspan></text>
  <text class="area-label-pink" x="1084" y="264"><tspan x="1084" dy="0">BGP ASN</tspan><tspan x="1084" dy="32">65006</tspan></text>
  <text class="ibgp" x="307" y="213"><tspan x="307" dy="0">iBGP</tspan><tspan x="307" dy="32">Full Mesh</tspan></text>
</svg>
