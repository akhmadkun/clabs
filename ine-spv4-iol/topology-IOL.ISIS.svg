<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1568" height="996" viewBox="0 0 1568 996">
  <title>ISIS IOL Topology</title>
  <desc>Editable vector topology with IOL routers R1–R6, IOS XR routers XR1–XR2, link interface labels, and IP addressing notes.</desc>
  <defs>
    <linearGradient id="iolFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f7fa"/>
    </linearGradient>
    <linearGradient id="xrdFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e9"/>
      <stop offset="1" stop-color="#ffe6b9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .link { fill: none; stroke: #34383b; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111820; stroke: none; }
      .router-label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111820; text-anchor: middle; }
      .note-title { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111820; }
      .note-line { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #111820; }
      .iol-outline { fill: url(#iolFill); stroke: #6ea7c0; stroke-width: 1.7; }
      .xrd-outline { fill: url(#xrdFill); stroke: #f5b74f; stroke-width: 1.7; }
      .iol-arrow { fill: #0d5c80; stroke: #0d5c80; stroke-linejoin: round; }
      .xrd-arrow { fill: #d99717; stroke: #d99717; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1568" height="996" fill="#ffffff"/>

  <!-- Links are drawn first so they sit beneath router nodes. -->
  <g id="links">
    <path id="link-R1-R2" class="link" d="M130 175 L130 360"/>
    <path id="link-R2-R3" class="link" d="M162 414 L370 536"/>
    <path id="link-R2-R4" class="link" d="M151 425 L378 772"/>
    <path id="link-R3-R4" class="link" d="M403 589 L403 763"/>
    <path id="link-R3-R6" class="link" d="M439 552 L768 552"/>
    <path id="link-R4-R6" class="link" d="M433 781 L775 570"/>
    <path id="link-R4-R5" class="link" d="M440 800 L768 800"/>
    <path id="link-R5-R6" class="link" d="M804 764 L804 589"/>
    <path id="link-R5-XR1" class="link" d="M828 773 L1078 421"/>
    <path id="link-R6-XR1" class="link" d="M839 536 L1066 415"/>
    <path id="link-XR1-XR2" class="link" d="M1099 175 L1099 360"/>
  </g>

  <!-- Interface labels remain separate, editable text objects. -->
  <g id="interface-labels">
    <text class="label" x="143" y="270">Ethernet0/1.12</text>
    <text class="label" x="209" y="443" transform="rotate(31 209 443)">Ethernet0/1.23</text>
    <text class="label" x="236" y="556" transform="rotate(56 236 556)">Ethernet0/1.24</text>
    <text class="label" x="394" y="752" transform="rotate(-90 394 752)">Ethernet0/1.34</text>
    <text class="label" x="534" y="539">Ethernet0/1.36</text>
    <text class="label" x="521" y="711" transform="rotate(-31 521 711)">Ethernet0/1.46</text>
    <text class="label" x="535" y="824">Ethernet0/1.45</text>
    <text class="label" x="793" y="754" transform="rotate(-90 793 754)">Ethernet0/1.56</text>
    <text class="label" x="883" y="687" transform="rotate(-55 883 687)">Ethernet0/1.519</text>
    <text class="label" x="875" y="511" transform="rotate(-28 875 511)">Ethernet0/1.619</text>
    <text class="label" x="954" y="270">Gi0/0/0.1920</text>
  </g>

  <!-- IOL router groups: individual circles and arrows are editable. -->
  <g id="router-R1" transform="translate(130 139)">
    <circle class="iol-outline" r="35" filter="url(#softShadow)"/>
    <g class="iol-arrow" stroke-width="2.3">
      <path d="M-5 -5 L-17 -17 M-17 -17 L-7 -15 L-15 -7 Z"/>
      <path d="M5 -5 L17 -17 M17 -17 L15 -7 L7 -15 Z"/>
      <path d="M-5 5 L-17 17 M-17 17 L-7 15 L-15 7 Z"/>
      <path d="M5 5 L17 17 M17 17 L15 7 L7 15 Z"/>
    </g>
    <text class="router-label" x="0" y="-48">R1</text>
  </g>
  <g id="router-R2" transform="translate(130 396)">
    <circle class="iol-outline" r="35" filter="url(#softShadow)"/>
    <g class="iol-arrow" stroke-width="2.3">
      <path d="M-5 -5 L-17 -17 M-17 -17 L-7 -15 L-15 -7 Z"/>
      <path d="M5 -5 L17 -17 M17 -17 L15 -7 L7 -15 Z"/>
      <path d="M-5 5 L-17 17 M-17 17 L-7 15 L-15 7 Z"/>
      <path d="M5 5 L17 17 M17 17 L15 7 L7 15 Z"/>
    </g>
    <text class="router-label" x="-58" y="7">R2</text>
  </g>
  <g id="router-R3" transform="translate(403 552)">
    <circle class="iol-outline" r="35" filter="url(#softShadow)"/>
    <g class="iol-arrow" stroke-width="2.3">
      <path d="M-5 -5 L-17 -17 M-17 -17 L-7 -15 L-15 -7 Z"/>
      <path d="M5 -5 L17 -17 M17 -17 L15 -7 L7 -15 Z"/>
      <path d="M-5 5 L-17 17 M-17 17 L-7 15 L-15 7 Z"/>
      <path d="M5 5 L17 17 M17 17 L15 7 L7 15 Z"/>
    </g>
    <text class="router-label" x="0" y="-47">R3</text>
  </g>
  <g id="router-R4" transform="translate(403 800)">
    <circle class="iol-outline" r="35" filter="url(#softShadow)"/>
    <g class="iol-arrow" stroke-width="2.3">
      <path d="M-5 -5 L-17 -17 M-17 -17 L-7 -15 L-15 -7 Z"/>
      <path d="M5 -5 L17 -17 M17 -17 L15 -7 L7 -15 Z"/>
      <path d="M-5 5 L-17 17 M-17 17 L-7 15 L-15 7 Z"/>
      <path d="M5 5 L17 17 M17 17 L15 7 L7 15 Z"/>
    </g>
    <text class="router-label" x="0" y="61">R4</text>
  </g>
  <g id="router-R5" transform="translate(804 800)">
    <circle class="iol-outline" r="35" filter="url(#softShadow)"/>
    <g class="iol-arrow" stroke-width="2.3">
      <path d="M-5 -5 L-17 -17 M-17 -17 L-7 -15 L-15 -7 Z"/>
      <path d="M5 -5 L17 -17 M17 -17 L15 -7 L7 -15 Z"/>
      <path d="M-5 5 L-17 17 M-17 17 L-7 15 L-15 7 Z"/>
      <path d="M5 5 L17 17 M17 17 L15 7 L7 15 Z"/>
    </g>
    <text class="router-label" x="0" y="61">R5</text>
  </g>
  <g id="router-R6" transform="translate(804 552)">
    <circle class="iol-outline" r="35" filter="url(#softShadow)"/>
    <g class="iol-arrow" stroke-width="2.3">
      <path d="M-5 -5 L-17 -17 M-17 -17 L-7 -15 L-15 -7 Z"/>
      <path d="M5 -5 L17 -17 M17 -17 L15 -7 L7 -15 Z"/>
      <path d="M-5 5 L-17 17 M-17 17 L-7 15 L-15 7 Z"/>
      <path d="M5 5 L17 17 M17 17 L15 7 L7 15 Z"/>
    </g>
    <text class="router-label" x="0" y="-48">R6</text>
  </g>

  <!-- IOS XR nodes -->
  <g id="router-XR1" transform="translate(1099 396)">
    <circle class="xrd-outline" r="35" filter="url(#softShadow)"/>
    <g class="xrd-arrow" stroke-width="2.3">
      <path d="M-5 -5 L-17 -17 M-17 -17 L-7 -15 L-15 -7 Z"/>
      <path d="M5 -5 L17 -17 M17 -17 L15 -7 L7 -15 Z"/>
      <path d="M-5 5 L-17 17 M-17 17 L-7 15 L-15 7 Z"/>
      <path d="M5 5 L17 17 M17 17 L15 7 L7 15 Z"/>
    </g>
    <text class="router-label" x="48" y="7">XR1</text>
  </g>
  <g id="router-XR2" transform="translate(1099 139)">
    <circle class="xrd-outline" r="35" filter="url(#softShadow)"/>
    <g class="xrd-arrow" stroke-width="2.3">
      <path d="M-5 -5 L-17 -17 M-17 -17 L-7 -15 L-15 -7 Z"/>
      <path d="M5 -5 L17 -17 M17 -17 L15 -7 L7 -15 Z"/>
      <path d="M-5 5 L-17 17 M-17 17 L-7 15 L-15 7 Z"/>
      <path d="M5 5 L17 17 M17 17 L15 7 L7 15 Z"/>
    </g>
    <text class="router-label" x="0" y="-48">XR2</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="1186" y="477" width="312" height="219" rx="31" fill="#ffffff" stroke="#686868" stroke-width="1.8"/>
    <g transform="translate(1279 537)">
      <circle class="iol-outline" r="35"/>
      <g class="iol-arrow" stroke-width="2.3">
        <path d="M-5 -5 L-17 -17 M-17 -17 L-7 -15 L-15 -7 Z"/>
        <path d="M5 -5 L17 -17 M17 -17 L15 -7 L7 -15 Z"/>
        <path d="M-5 5 L-17 17 M-17 17 L-7 15 L-15 7 Z"/>
        <path d="M5 5 L17 17 M17 17 L15 7 L7 15 Z"/>
      </g>
    </g>
    <text class="note-title" x="1333" y="545">IOL</text>
    <g transform="translate(1279 628)">
      <circle class="xrd-outline" r="35"/>
      <g class="xrd-arrow" stroke-width="2.3">
        <path d="M-5 -5 L-17 -17 M-17 -17 L-7 -15 L-15 -7 Z"/>
        <path d="M5 -5 L17 -17 M17 -17 L15 -7 L7 -15 Z"/>
        <path d="M-5 5 L-17 17 M-17 17 L-7 15 L-15 7 Z"/>
        <path d="M5 5 L17 17 M17 17 L15 7 L7 15 Z"/>
      </g>
    </g>
    <text class="note-title" x="1333" y="637">XRd</text>
  </g>

  <!-- Addressing notes -->
  <g id="ip-addressing-notes">
    <rect x="1186" y="728" width="316" height="185" rx="30" fill="#ffffff" stroke="#686868" stroke-width="1.8"/>
    <text class="note-title" x="1207" y="751">IP Addressing:</text>
    <text class="note-line" x="1214" y="778">- Loopback0  X.X.X.X/32</text>
    <text class="note-line" x="1214" y="802">- R1-R2 10.1.2.0/24</text>
    <text class="note-line" x="1214" y="826">- XR1-XR2 10.19.20.0/24</text>
    <text class="note-line" x="1214" y="850">- All other links 20.X.Y.0/24</text>
    <text class="note-line" x="1214" y="874">- XR1 has X=19</text>
    <text class="note-line" x="1214" y="898">- XR2 has X=20</text>
  </g>
</svg>
