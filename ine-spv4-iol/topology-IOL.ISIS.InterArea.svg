<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="760" viewBox="0 0 1400 760">
<title>IS-IS Multi-Area Topology — IOL and IOS-XR</title>
<desc>Editable vector topology. R1 through R6 are Cisco IOL-style routers and use Eth0/1 interface names. XR1 and XR2 remain IOS-XR-style routers.</desc>
<defs>
  <linearGradient id="iolFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2fbff"/></linearGradient>
  <linearGradient id="xrFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#fff0ce"/></linearGradient>
  <marker id="arrBlue" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L5,2.5 L0,5 Z" fill="#17678b"/></marker>
  <marker id="arrOrange" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L5,2.5 L0,5 Z" fill="#d99219"/></marker>
  <style>
    .areaTitle { font-family: Inter, "DejaVu Sans", sans-serif; font-size: 29px; font-weight: 750; fill: #132238; text-anchor: middle; }
    .routerLabel { font-family: Inter, "DejaVu Sans", sans-serif; font-size: 18px; font-weight: 700; fill: #0d1c2b; text-anchor: middle; }
    .linkLabel { font-family: Inter, "DejaVu Sans", sans-serif; font-size: 16px; font-weight: 700; fill: #101820; text-anchor: middle; stroke: none; }
    .link { stroke: #283746; stroke-width: 2.1; fill: none; stroke-linecap: round; }
  </style>
  <g id="iol-router">
    <circle r="27" fill="url(#iolFill)" stroke="#69a9c5" stroke-width="1.8"/>
    <g stroke="#17678b" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M-2 -2 L-10 -10"/><path d="M2 -2 L10 -10"/>
      <path d="M-2 2 L-10 10"/><path d="M2 2 L10 10"/>
    </g>
    <g fill="#17678b">
      <path d="M-16 -16 L-7 -14 L-14 -7 Z"/><path d="M16 -16 L7 -14 L14 -7 Z"/>
      <path d="M-16 16 L-7 14 L-14 7 Z"/><path d="M16 16 L7 14 L14 7 Z"/>
    </g>
  </g>
  <g id="xrd-router">
    <circle r="27" fill="url(#xrFill)" stroke="#f0b64f" stroke-width="1.8"/>
    <g stroke="#d99219" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M-2 -2 L-10 -10"/><path d="M2 -2 L10 -10"/>
      <path d="M-2 2 L-10 10"/><path d="M2 2 L10 10"/>
    </g>
    <g fill="#d99219">
      <path d="M-16 -16 L-7 -14 L-14 -7 Z"/><path d="M16 -16 L7 -14 L14 -7 Z"/>
      <path d="M-16 16 L-7 14 L-14 7 Z"/><path d="M16 16 L7 14 L14 7 Z"/>
    </g>
  </g>
</defs>

<!-- White canvas background -->
<rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>

<!-- Area regions -->
<rect x="24" y="55" width="420" height="635" rx="38" fill="#eaf6fc" stroke="#77b7df" stroke-width="1.8"/>
<rect x="735" y="330" width="275" height="350" rx="36" fill="#e9f7e6" stroke="#91ce87" stroke-width="1.8"/>
<rect x="1055" y="22" width="280" height="410" rx="36" fill="#f2e8f6" stroke="#bd8bd1" stroke-width="1.8"/>

<!-- Area titles -->
<text class="areaTitle" x="320" y="228">AREA</text>
<text class="areaTitle" x="320" y="263">49.1234</text>
<text class="areaTitle" x="872" y="365">AREA</text>
<text class="areaTitle" x="872" y="400">49.0056</text>
<text class="areaTitle" x="1195" y="72">AREA</text>
<text class="areaTitle" x="1195" y="107">49.1920</text>

<!-- Links (drawn behind routers) -->
<g class="link">
  <line x1="140" y1="155" x2="140" y2="330"/>
  <line x1="164" y1="343" x2="316" y2="454"/>
  <line x1="158" y1="355" x2="320" y2="577"/>
  <line x1="340" y1="497" x2="340" y2="558"/>
  <line x1="367" y1="470" x2="798" y2="470"/>
  <line x1="364" y1="576" x2="800" y2="478"/>
  <line x1="367" y1="585" x2="798" y2="585"/>
  <line x1="825" y1="497" x2="825" y2="558"/>
  <line x1="849" y1="461" x2="1160" y2="340"/>
  <line x1="844" y1="570" x2="1165" y2="354"/>
  <line x1="1185" y1="182" x2="1185" y2="308"/>
</g>

<!-- Interface labels. Each is an individual editable text object. -->
<g class="linkLabel">
  <text x="183" y="248">Eth0/1.12</text>
  <text x="244" y="393" transform="rotate(36 244 393)">Eth0/1.23</text>
  <text x="249" y="474" transform="rotate(53 249 474)">Eth0/1.24</text>
  <text x="359" y="526" transform="rotate(-90 359 526)">Eth0/1.34</text>
  <text x="583" y="457">Eth0/1.36</text>
  <text x="588" y="523" transform="rotate(-13.5 588 523)">Eth0/1.46</text>
  <text x="583" y="611">Eth0/1.45</text>
  <text x="850" y="536" transform="rotate(-90 850 536)">Eth0/1.56</text>
  <text x="1010" y="396" transform="rotate(-15.5 1010 396)">Gi0/0/0.619</text>
  <text x="1008" y="478" transform="rotate(-35 1008 478)">Gi0/0/0.519</text>
  <text x="1148" y="258" style="text-anchor:end">Gi0/0/0.1920</text>
</g>

<!-- Routers -->
<g id="routers">
  <use xlink:href="#iol-router" x="140" y="137"/>
  <text class="routerLabel" x="140" y="99">R1</text>
  <use xlink:href="#iol-router" x="140" y="330"/>
  <text class="routerLabel" x="105" y="337">R2</text>
  <use xlink:href="#iol-router" x="340" y="470"/>
  <text class="routerLabel" x="340" y="430">R3</text>
  <use xlink:href="#iol-router" x="340" y="585"/>
  <text class="routerLabel" x="340" y="626">R4</text>
  <use xlink:href="#iol-router" x="825" y="470"/>
  <text class="routerLabel" x="825" y="430">R6</text>
  <use xlink:href="#iol-router" x="825" y="585"/>
  <text class="routerLabel" x="825" y="626">R5</text>
  <use xlink:href="#xrd-router" x="1185" y="175"/>
  <text class="routerLabel" x="1185" y="136">XR2</text>
  <use xlink:href="#xrd-router" x="1185" y="335"/>
  <text class="routerLabel" x="1230" y="341">XR1</text>
</g>
</svg>