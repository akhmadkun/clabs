system {
    host-name EX-TRAIN-SW1;
}

vlans {
    USERS {
        vlan-id 10;
    }
}

interfaces {
    ge-0/0/1 {
        description SW2-RSTP-LINK;
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members USERS;
                }
            }
        }
    }
    ge-0/0/2 {
        description SW3-RSTP-LINK;
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members USERS;
                }
            }
        }
    }
    ge-0/0/3 {
        description TEST-PROTECTED-DOWNLINK-TO-SW4;
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members USERS;
                }
            }
        }
    }
    ge-0/0/10 {
        description HOST1-ACCESS;
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members USERS;
                }
            }
        }
    }
}

protocols {
    rstp {
        bpdu-block-on-edge;
        bridge-priority 4k;
        interface ge-0/0/1 {
            mode point-to-point;
        }
        interface ge-0/0/2 {
            mode point-to-point;
        }
        interface ge-0/0/3 {
            mode point-to-point;
            no-root-port;
        }
        interface ge-0/0/10 {
            edge;
        }
    }
}
