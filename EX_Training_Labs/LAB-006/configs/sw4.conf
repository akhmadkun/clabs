system {
    host-name EX-TRAIN-SW4;
}

vlans {
    USERS {
        vlan-id 10;
    }
}

interfaces {
    ge-0/0/1 {
        description SW1-TEST-PROTECTED-DOWNLINK;
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members USERS;
                }
            }
        }
    }
}

protocols {
    rstp {
        bridge-priority 16k;
        interface ge-0/0/1 {
            mode point-to-point;
        }
    }
}
