system {
    host-name EX-TRAIN-SW3;
}

vlans {
    USERS {
        vlan-id 10;
    }
}

interfaces {
    ge-0/0/1 {
        description SW2-RSTP-LINK;
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members USERS;
                }
            }
        }
    }
    ge-0/0/2 {
        description SW1-RSTP-LINK;
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members USERS;
                }
            }
        }
    }
    ge-0/0/10 {
        description HOST2-ACCESS;
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members USERS;
                }
            }
        }
    }
}

protocols {
    rstp {
        bridge-priority 12k;
        interface ge-0/0/1 {
            mode point-to-point;
        }
        interface ge-0/0/2 {
            mode point-to-point;
        }
        interface ge-0/0/10 {
            edge;
        }
    }
}
