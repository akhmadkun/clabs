  <title
     id="title">Juniper EX Golden Training Topology</title>
  <desc
     id="desc">Four Juniper EX switches. SW1 connects to SW2, SW3, and SW4 using ge-0/0/1, ge-0/0/2, and ge-0/0/4 respectively. SW2 and SW3 are connected with two LACP links on ge-0/0/2 and ge-0/0/3. Student endpoints use VLAN 10 and teacher endpoints use VLAN 20.</desc>
