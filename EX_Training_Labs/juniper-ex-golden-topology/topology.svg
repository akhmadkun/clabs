  <path d="M 345 540 L 214 700" fill="none" stroke="#2683bb" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 450 540 L 438 700" fill="none" stroke="#be7b24" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 850 540 L 844 700" fill="none" stroke="#2683bb" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 955 540 L 1075 700" fill="none" stroke="#be7b24" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="translate(252 634) rotate(-50)"><rect x="-76" y="-13" width="152" height="24" rx="7" fill="#eef9ff" stroke="#bce4f7"/><text y="3" text-anchor="middle" class="port">SW2 ge-0/0/10</text></g>
  <g transform="translate(444 625) rotate(-87)"><rect x="-75" y="-13" width="150" height="24" rx="7" fill="#fff8ea" stroke="#f0d8a8"/><text y="3" text-anchor="middle" class="port">SW2 ge-0/0/11</text></g>
  <g transform="translate(848 625) rotate(-88)"><rect x="-75" y="-13" width="150" height="24" rx="7" fill="#eef9ff" stroke="#bce4f7"/><text y="3" text-anchor="middle" class="port">SW3 ge-0/0/10</text></g>
  <g transform="translate(1015 633) rotate(53)"><rect x="-75" y="-13" width="150" height="24" rx="7" fill="#fff8ea" stroke="#f0d8a8"/><text y="3" text-anchor="middle" class="port">SW3 ge-0/0/11</text></g>

