  <g filter="url(#shadow)"><rect x="565" y="150" width="250" height="128" rx="17" fill="url(#switchFill)" stroke="#b8cbe0" stroke-width="1.6"/></g>
  <g transform="translate(589 174)"><rect width="44" height="44" rx="11" fill="#dceaf9"/><path d="M8 12 H36 M8 21 H36 M8 30 H36" stroke="#3969b2" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#3969b2"/><circle cx="12" cy="21" r="2" fill="#3969b2"/><circle cx="12" cy="30" r="2" fill="#3969b2"/></g>
  <text x="648" y="189" class="sw-name">SW1</text><text x="648" y="211" class="sw-role">Root bridge for RSTP labs</text><text x="589" y="249" class="port">Priority: lab-specific</text>

  <g filter="url(#shadow)"><rect x="275" y="420" width="250" height="120" rx="17" fill="url(#switchFill)" stroke="#b8cbe0" stroke-width="1.6"/></g>
  <g transform="translate(298 442)"><rect width="43" height="43" rx="10" fill="#dceaf9"/><path d="M8 12 H35 M8 21 H35 M8 30 H35" stroke="#3969b2" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#3969b2"/><circle cx="12" cy="21" r="2" fill="#3969b2"/><circle cx="12" cy="30" r="2" fill="#3969b2"/></g>
  <text x="355" y="458" class="sw-name">SW2</text><text x="355" y="480" class="sw-role">Student1 + Teacher1</text><text x="298" y="515" class="port">Access: ge-0/0/10, ge-0/0/11</text>

  <g filter="url(#shadow)"><rect x="775" y="420" width="250" height="120" rx="17" fill="url(#switchFill)" stroke="#b8cbe0" stroke-width="1.6"/></g>
  <g transform="translate(798 442)"><rect width="43" height="43" rx="10" fill="#dceaf9"/><path d="M8 12 H35 M8 21 H35 M8 30 H35" stroke="#3969b2" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#3969b2"/><circle cx="12" cy="21" r="2" fill="#3969b2"/><circle cx="12" cy="30" r="2" fill="#3969b2"/></g>
  <text x="855" y="458" class="sw-name">SW3</text><text x="855" y="480" class="sw-role">Student2 + Teacher2</text><text x="798" y="515" class="port">Access: ge-0/0/10, ge-0/0/11</text>

  <g filter="url(#shadow)"><rect x="1084" y="170" width="246" height="120" rx="17" fill="url(#switchFill)" stroke="#b8cbe0" stroke-width="1.6"/></g>
  <g transform="translate(1106 191)"><rect width="43" height="43" rx="10" fill="#dceaf9"/><path d="M8 12 H35 M8 21 H35 M8 30 H35" stroke="#3969b2" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#3969b2"/><circle cx="12" cy="21" r="2" fill="#3969b2"/><circle cx="12" cy="30" r="2" fill="#3969b2"/></g>
  <text x="1163" y="208" class="sw-name">SW4</text><text x="1163" y="230" class="sw-role">Downstream / BPDU source</text><text x="1107" y="265" class="port">Uplink: ge-0/0/1</text>

  <!-- Host cards -->
  <g filter="url(#shadow)"><rect x="105" y="700" width="215" height="106" rx="15" fill="#f2fbff" stroke="#9bd7ef" stroke-width="1.5"/></g>
  <g transform="translate(124 719)"><rect width="34" height="27" rx="4" fill="#d7f0fc" stroke="#2683bb"/><path d="M7 31 H27 M17 27 V31" stroke="#2683bb" stroke-width="2" stroke-linecap="round"/></g>
  <text x="170" y="735" class="host-name">Student1</text><text x="124" y="771" class="host-ip">10.10.10.11/24</text><text x="124" y="790" class="sw-role">VLAN 10 • Students</text>

  <g filter="url(#shadow)"><rect x="330" y="700" width="215" height="106" rx="15" fill="#fffaf0" stroke="#f0d19b" stroke-width="1.5"/></g>
  <g transform="translate(349 719)"><rect width="34" height="27" rx="4" fill="#ffedcb" stroke="#be7b24"/><path d="M7 31 H27 M17 27 V31" stroke="#be7b24" stroke-width="2" stroke-linecap="round"/></g>
  <text x="395" y="735" class="host-name">Teacher1</text><text x="349" y="771" class="host-ip">20.20.20.11/24</text><text x="349" y="790" class="sw-role">VLAN 20 • Teachers</text>

  <g filter="url(#shadow)"><rect x="740" y="700" width="215" height="106" rx="15" fill="#f2fbff" stroke="#9bd7ef" stroke-width="1.5"/></g>
  <g transform="translate(759 719)"><rect width="34" height="27" rx="4" fill="#d7f0fc" stroke="#2683bb"/><path d="M7 31 H27 M17 27 V31" stroke="#2683bb" stroke-width="2" stroke-linecap="round"/></g>
  <text x="805" y="735" class="host-name">Student2</text><text x="759" y="771" class="host-ip">10.10.10.12/24</text><text x="759" y="790" class="sw-role">VLAN 10 • Students</text>

  <g filter="url(#shadow)"><rect x="975" y="700" width="215" height="106" rx="15" fill="#fffaf0" stroke="#f0d19b" stroke-width="1.5"/></g>
  <g transform="translate(994 719)"><rect width="34" height="27" rx="4" fill="#ffedcb" stroke="#be7b24"/><path d="M7 31 H27 M17 27 V31" stroke="#be7b24" stroke-width="2" stroke-linecap="round"/></g>
  <text x="1040" y="735" class="host-name">Teacher2</text><text x="994" y="771" class="host-ip">20.20.20.12/24</text><text x="994" y="790" class="sw-role">VLAN 20 • Teachers</text>

  <!-- Footer practical note -->
  <rect x="64" y="850" width="1412" height="94" rx="15" fill="#ffffff" stroke="#d7e1ed"/>
  <text x="88" y="880" class="legend">IMPORTANT</text>
  <text x="88" y="905" class="note">Physical links are defined here; VLANs, trunk membership, LACP, and RSTP behavior remain lab-specific configuration tasks.</text>
  <text x="88" y="925" class="note">Before changing labs, destroy the previous deployment because prefix: "" reuses node names (sw1, sw2, sw3, sw4).</text>
  <text x="1474" y="978" text-anchor="end" class="subtitle">Editable SVG • Generated for Juniper EX training</text>
</svg>
