<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1010" viewBox="0 0 1540 1010" role="img" aria-labelledby="title desc">
  <title id="title">Juniper EX Series Golden Training Topology</title>
  <desc id="desc">Four vJunos switches, a redundant Layer 2 triangle, two SW2-to-SW3 links for LACP, and four Linux hosts representing Students VLAN 10 and Teachers VLAN 20.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
    <linearGradient id="switchFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.11"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3969b2"/></marker>
    <style>
      .title{font:700 29px 'Inter', 'DejaVu Sans', sans-serif; fill:#14253d; letter-spacing:.2px}
      .subtitle{font:400 14px 'Inter', 'DejaVu Sans', sans-serif; fill:#607087}
      .sw-name{font:700 21px 'Inter', 'DejaVu Sans', sans-serif; fill:#18324f}
      .sw-role{font:500 12px 'Inter', 'DejaVu Sans', sans-serif; fill:#5a6e84}
      .port{font:600 12px 'Inter', 'DejaVu Sans', sans-serif; fill:#344960}
      .host-name{font:700 17px 'Inter', 'DejaVu Sans', sans-serif; fill:#1e3249}
      .host-ip{font:500 12px 'Inter', 'DejaVu Sans', sans-serif; fill:#53677e}
      .pill{font:600 12px 'Inter', 'DejaVu Sans', sans-serif; fill:#344960}
      .note{font:500 12px 'Inter', 'DejaVu Sans', sans-serif; fill:#607087}
      .legend{font:600 12px 'Inter', 'DejaVu Sans', sans-serif; fill:#344960}
    </style>
  </defs>
  <rect width="1540" height="1010" fill="url(#bg)" rx="22"/>
  <text x="64" y="60" class="title">JUNIPER EX SERIES — GOLDEN TRAINING TOPOLOGY</text>
  <text x="64" y="88" class="subtitle">Containerlab • vJunos-switch 25.4R1.12 • Shared physical topology for LAB-001 through LAB-006</text>
  <g transform="translate(64 111)"><rect width="248" height="29" rx="14.5" fill="#e3edf9"/><circle cx="15" cy="14.5" r="5" fill="#3969b2"/><text x="29" y="19" class="pill">RSTP redundant triangle</text></g>
  <g transform="translate(324 111)"><rect width="250" height="29" rx="14.5" fill="#eee8fb"/><circle cx="15" cy="14.5" r="5" fill="#7b55b8"/><text x="29" y="19" class="pill">Dual physical links for LACP</text></g>
  <g transform="translate(586 111)"><rect width="245" height="29" rx="14.5" fill="#fff0d9"/><circle cx="15" cy="14.5" r="5" fill="#be7b24"/><text x="29" y="19" class="pill">VLAN 20 • Teachers</text></g>
  <g transform="translate(843 111)"><rect width="235" height="29" rx="14.5" fill="#dff3ff"/><circle cx="15" cy="14.5" r="5" fill="#2683bb"/><text x="29" y="19" class="pill">VLAN 10 • Students</text></g>

  <!-- Switch-to-switch links behind nodes -->
  <path d="M 620 278 L 473 418" fill="none" stroke="#3969b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M 738 278 L 845 418" fill="none" stroke="#3969b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M 810 214 L 1084 237" fill="none" stroke="#3969b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M 525 461 L 775 461" fill="none" stroke="#7b55b8" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 525 505 L 775 505" fill="none" stroke="#7b55b8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Topology interface labels -->
  <g transform="translate(457 318) rotate(-43)"><rect x="-87" y="-14" width="174" height="25" rx="7" fill="#ffffff" stroke="#d7e1ed"/><text y="3" text-anchor="middle" class="port">SW1 ge-0/0/1 ↔ SW2 ge-0/0/1</text></g>
  <g transform="translate(870 347)"><rect x="-103" y="-13" width="206" height="25" rx="7" fill="#ffffff" stroke="#d7e1ed"/><text y="4" text-anchor="middle" class="port">SW1 ge-0/0/2 ↔ SW3 ge-0/0/1</text></g>
  <g transform="translate(946 205) rotate(5)"><rect x="-88" y="-14" width="176" height="25" rx="7" fill="#ffffff" stroke="#d7e1ed"/><text y="3" text-anchor="middle" class="port">SW1 ge-0/0/3 ↔ SW4 ge-0/0/1</text></g>
  <g transform="translate(650 441)"><rect x="-115" y="-13" width="230" height="25" rx="7" fill="#f5f0ff" stroke="#d8c9f0"/><text y="4" text-anchor="middle" class="port">LACP member 1 • ge-0/0/2 ↔ ge-0/0/2</text></g>
  <g transform="translate(650 526)"><rect x="-115" y="-13" width="230" height="25" rx="7" fill="#f5f0ff" stroke="#d8c9f0"/><text y="4" text-anchor="middle" class="port">LACP member 2 • ge-0/0/3 ↔ ge-0/0/3</text></g>

