system {
    host-name EX-TRAIN-SW2;
}

vlans {
    USERS {
        vlan-id 10;
    }
}

interfaces {
    ge-0/0/1 {
        description SW1-RSTP-LINK-1;
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members USERS;
                }
            }
        }
    }
    ge-0/0/2 {
        description SW3-RSTP-LINK-1;
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members USERS;
                }
            }
        }
    }
    ge-0/0/10 {
    description HOST1-ACCESS;
    unit 0 {
        family ethernet-switching {
            interface-mode access;
            vlan {
                members USERS;
            }
        }
    }
}
}

protocols {
    rstp {
        interface ge-0/0/1 {
            mode point-to-point;
        }
        interface ge-0/0/2 {
            mode point-to-point;
        }
        interface ge-0/0/10 {
            edge;
        }
        bridge-priority 8k;
    }
}
