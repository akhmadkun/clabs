<text x="848" y="232" text-anchor="middle" class="linklabel">VLAN 24 · eth1.24</text><text x="848" y="249" text-anchor="middle" class="addr">10.0.24.0/30 · cost 1</text></g>
<g><rect x="768" y="367" width="160" height="48" rx="10" fill="#eaf2f8" stroke="#cfdeea"/>
<text x="848" y="386" text-anchor="middle" class="linklabel">VLAN 34 · eth1.34</text><text x="848" y="403" text-anchor="middle" class="addr">10.0.34.0/30 · cost 1</text></g>

<!-- Routers -->
<g filter="url(#shadow)"><rect x="100" y="265" width="220" height="105" rx="18" fill="url(#router)" stroke="#9ab6ca" stroke-width="2"/>
<rect x="530" y="135" width="220" height="105" rx="18" fill="url(#router)" stroke="#e3aa65" stroke-width="3"/>
<rect x="530" y="395" width="220" height="105" rx="18" fill="url(#router)" stroke="#9ab6ca" stroke-width="2"/>
<rect x="960" y="265" width="220" height="105" rx="18" fill="url(#router)" stroke="#9ab6ca" stroke-width="2"/></g>
<g>
<circle cx="130" cy="295" r="10" fill="#2a6a91"/><circle cx="560" cy="165" r="10" fill="#c97b24"/><circle cx="560" cy="425" r="10" fill="#2a6a91"/><circle cx="990" cy="295" r="10" fill="#2a6a91"/>
<text x="210" y="309" text-anchor="middle" class="routername">R1</text><text x="210" y="335" text-anchor="middle" class="rid">RID / lo0: 10.1.1.1/32</text>
<text x="640" y="179" text-anchor="middle" class="routername">R2</text><text x="640" y="205" text-anchor="middle" class="rid">RID / lo0: 10.1.1.2/32</text>
<text x="640" y="439" text-anchor="middle" class="routername">R3</text><text x="640" y="465" text-anchor="middle" class="rid">RID / lo0: 10.1.1.3/32</text>
<text x="1070" y="309" text-anchor="middle" class="routername">R4</text><text x="1070" y="335" text-anchor="middle" class="rid">RID / lo0: 10.1.1.4/32</text>
<rect x="573" y="213" width="134" height="20" rx="10" fill="#c97b24"/><text x="640" y="227" text-anchor="middle" class="badge">OVERLOAD TEST</text>
</g>

<!-- task strips -->
<g><rect x="68" y="545" width="350" height="145" rx="16" fill="#eff7fb" stroke="#d1e4ef"/>
<rect x="88" y="565" width="34" height="26" rx="7" fill="#2a6a91"/><text x="105" y="583" text-anchor="middle" class="badge">01</text>
<text x="136" y="583" class="paneltitle">Overload bit</text>
<text x="90" y="613" class="paneltext">• Raise transit-link metrics in R2's LSA</text>
<text x="90" y="635" class="paneltext">• Confirm R1 reaches R4 via R3</text>
<text x="90" y="657" class="paneltext">• Verify R2's own loopback stays reachable</text>
</g>
<g><rect x="465" y="545" width="350" height="145" rx="16" fill="#fff7e9" stroke="#efdfc3"/>
<rect x="485" y="565" width="34" height="26" rx="7" fill="#c97b24"/><text x="502" y="583" text-anchor="middle" class="badge">02</text>
<text x="533" y="583" class="paneltitle">SPF scheduling</text>
<text x="487" y="613" class="paneltext">• Tune delay / rapid-runs / holddown</text>
<text x="487" y="635" class="paneltext">• Inspect active values in OSPF overview</text>
<text x="487" y="657" class="paneltext">• Treat manual flaps as observation, not benchmark</text>
</g>
<g><rect x="862" y="545" width="350" height="145" rx="16" fill="#f2f7f1" stroke="#d5e4d1"/>
<rect x="882" y="565" width="34" height="26" rx="7" fill="#4e8060"/><text x="899" y="583" text-anchor="middle" class="badge">03</text>
<text x="930" y="583" class="paneltitle">LSA propagation</text>
<text x="884" y="613" class="paneltext">• Change R1's eth1.13 metric</text>
<text x="884" y="635" class="paneltext">• Compare R1 Router-LSA at R4</text>
<text x="884" y="657" class="paneltext">• Restore metric and observe the next update</text>
</g>
<text x="640" y="735" text-anchor="middle" class="small">All links are OSPF P2P in Area 0 · Default cost 1 · Shared external bridge br-univ is not modified</text>
</svg>