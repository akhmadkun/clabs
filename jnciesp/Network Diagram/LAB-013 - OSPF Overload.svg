<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4fa"/></linearGradient>
  <linearGradient id="router" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8f0f8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#152a3b" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#607d94"/></marker>
  <style>
    .title{font:700 30px 'Inter','DejaVu Sans',sans-serif;fill:#12263a}
    .subtitle{font:400 15px 'Inter','DejaVu Sans',sans-serif;fill:#526579}
    .routername{font:700 23px 'Inter','DejaVu Sans',sans-serif;fill:#16324b}
    .rid{font:500 13px 'Inter','DejaVu Sans',sans-serif;fill:#536c80}
    .link{stroke:#57758d;stroke-width:4;fill:none;stroke-linecap:round}
    .linklabel{font:700 14px 'Inter','DejaVu Sans',sans-serif;fill:#183d5c}
    .addr{font:500 12px 'Inter','DejaVu Sans',sans-serif;fill:#3f5a70}
    .small{font:500 13px 'Inter','DejaVu Sans',sans-serif;fill:#445a6e}
    .paneltitle{font:700 16px 'Inter','DejaVu Sans',sans-serif;fill:#16324b}
    .paneltext{font:500 13px 'Inter','DejaVu Sans',sans-serif;fill:#425b70}
    .badge{font:700 12px 'Inter','DejaVu Sans',sans-serif;fill:#fff}
  </style>
</defs>
<rect width="1280" height="800" fill="url(#bg)" rx="26"/>
<rect x="25" y="25" width="1230" height="750" rx="24" fill="#ffffff" stroke="#d7e2ec" stroke-width="1.5"/>
<text x="64" y="80" class="title">LAB-013 · OSPF Overload, SPF &amp; LSA Flooding</text>
<text x="66" y="110" class="subtitle">Juniper cRPD · OSPFv2 · Area 0 · Control-plane convergence experiments</text>
<rect x="1024" y="51" width="174" height="35" rx="17.5" fill="#173f5f"/>
<text x="1111" y="73" text-anchor="middle" class="badge">CORE LAB</text>

