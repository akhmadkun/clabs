    <style
       id="style1"><![CDATA[
      :root {
        --navy: #102b45;
        --blue: #2375ba;
        --blue-pale: #dcecf8;
        --green: #2b895b;
        --green-pale: #e5fbf5;
        --canvas: #f4f8fc;
        --ink: #112c47;
        --muted: #566678;
      }
      text {
        font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
      }
      .header-title { fill: #ffffff; font-size: 50px; font-weight: 700; letter-spacing: .2px; }
      .header-subtitle { fill: #e2ebf4; font-size: 26px; font-weight: 400; }
      .router-box { fill: #ffffff; stroke: #2375ba; stroke-width: 5; }
      .router-name { fill: #112c47; font-size: 38px; font-weight: 700; text-anchor: middle; }
      .router-ip { fill: #566678; font-size: 24px; font-weight: 400; text-anchor: middle; }
      .link-blue { fill: none; stroke: #2375ba; stroke-width: 6; stroke-linecap: square; }
      .management-box { fill: #dcecf8; stroke: #2375ba; stroke-width: 5; }
      .management-title { fill: #112c47; font-size: 29px; font-weight: 700; text-anchor: middle; }
      .management-subtitle { fill: #566678; font-size: 22px; font-weight: 400; text-anchor: middle; }
      .link-green { fill: none; stroke: #2b895b; stroke-width: 7; stroke-linecap: square; }
      .service-box { fill: #e5fbf5; stroke: #2b895b; stroke-width: 6; }
      .service-name { fill: #2b895b; font-size: 40px; font-weight: 700; text-anchor: middle; }
      .service-ip { fill: #112c47; font-size: 29px; font-weight: 700; text-anchor: middle; }
      .service-capabilities { fill: #566678; font-size: 25px; font-weight: 400; text-anchor: middle; }
      .footer { fill: #566678; font-size: 23px; font-weight: 400; }
    ]]></style>
