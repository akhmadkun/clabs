<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">LAB-019 OSPF Node-Link Protection</title>
  <desc id="desc">Four-router OSPF Area 0 point-to-point diamond. R1 vJunos is the point of local repair. R2 is the primary next-hop node. R3 is the node-protecting alternate. R4 loopback is the destination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eaf0f8"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172b4d" flood-opacity="0.12"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#0f172a}.subtitle{font:400 16px Inter,Arial,sans-serif;fill:#475569}
      .node{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:18;filter:url(#shadow)}
      .nodePLR{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:18;filter:url(#shadow)}
      .nodeTarget{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18;filter:url(#shadow)}
      .router{font:700 25px Inter,Arial,sans-serif;fill:#0f172a}.rid{font:500 15px Inter,Arial,sans-serif;fill:#475569}.platform{font:600 12px Inter,Arial,sans-serif;fill:#64748b;letter-spacing:.7px}
      .link{fill:none;stroke:#94a3b8;stroke-width:4;stroke-linecap:round}.primary{fill:none;stroke:#2563eb;stroke-width:6;stroke-linecap:round;marker-end:url(#arrowBlue)}.backup{fill:none;stroke:#059669;stroke-width:6;stroke-dasharray:13 9;stroke-linecap:round;marker-end:url(#arrowGreen)}
      .label{font:600 14px Inter,Arial,sans-serif;fill:#334155}.small{font:500 12px Inter,Arial,sans-serif;fill:#64748b}.pillBlue{fill:#dbeafe;stroke:#93c5fd}.pillGreen{fill:#d1fae5;stroke:#6ee7b7}.pill{rx:13;stroke-width:1.2}.pillTextBlue{font:700 12px Inter,Arial,sans-serif;fill:#1d4ed8}.pillTextGreen{font:700 12px Inter,Arial,sans-serif;fill:#047857}
      .section{font:700 17px Inter,Arial,sans-serif;fill:#0f172a}.body{font:400 14px Inter,Arial,sans-serif;fill:#334155}.metric{font:700 16px Inter,Arial,sans-serif;fill:#0f172a}
    </style>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <text x="80" y="78" class="title">LAB-019 · OSPF NODE-LINK PROTECTION</text>
  <text x="80" y="112" class="subtitle">Node-failure resilience · R1 protects the R4 loopback against failure of primary next-hop node R2</text>
  <rect x="80" y="148" width="1440" height="648" rx="28" fill="url(#panel)" stroke="#d7e0ec" stroke-width="1.5"/>
  <rect x="118" y="178" width="1364" height="52" rx="14" fill="#f1f5f9" stroke="#dbe3ee"/>
  <text x="145" y="211" class="section">OSPF Area 0 · Point-to-Point Core Diamond</text>
  <text x="1450" y="211" text-anchor="end" class="small">Existing shared topology · br-univ unchanged</text>

  <!-- links -->
  <path class="link" d="M445 405 L720 330"/>
  <path class="link" d="M445 460 L720 645"/>
  <path class="link" d="M930 330 L1180 405"/>
  <path class="link" d="M930 645 L1180 565"/>
  <!-- primary direction R1 -> R2 -->
  <path class="primary" d="M465 399 L700 335"/>
  <!-- node protecting alternate R1 -> R3 -->
  <path class="backup" d="M445 455 L700 640"/>
  <!-- neutral R2/R3 to R4 links -->
  <path d="M948 335 L1155 398" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M948 640 L1155 572" stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#arrowGray)"/>

  <!-- nodes -->
  <rect x="235" y="340" width="220" height="130" class="nodePLR"/>
  <text x="345" y="386" text-anchor="middle" class="platform">POINT OF LOCAL REPAIR</text>
  <text x="345" y="420" text-anchor="middle" class="router">R1</text>
  <text x="345" y="446" text-anchor="middle" class="rid">RID 1.1.1.1</text>
  <text x="345" y="462" text-anchor="middle" class="platform">vJUNOS-ROUTER</text>

  <rect x="715" y="265" width="220" height="130" class="node"/>
  <text x="825" y="308" text-anchor="middle" class="platform">PRIMARY NEXT-HOP NODE</text>
  <text x="825" y="342" text-anchor="middle" class="router">R2</text>
  <text x="825" y="368" text-anchor="middle" class="rid">RID 2.2.2.2</text>
  <text x="825" y="384" text-anchor="middle" class="platform">cRPD · NODE TO PROTECT</text>

  <rect x="715" y="580" width="220" height="130" class="node"/>
  <text x="825" y="623" text-anchor="middle" class="platform">NODE-PROTECTING ALTERNATE</text>
  <text x="825" y="657" text-anchor="middle" class="router">R3</text>
  <text x="825" y="683" text-anchor="middle" class="rid">RID 3.3.3.3</text>
  <text x="825" y="699" text-anchor="middle" class="platform">cRPD · BACKUP NEIGHBOR</text>

  <rect x="1185" y="405" width="220" height="150" class="nodeTarget"/>
  <text x="1295" y="448" text-anchor="middle" class="platform">DESTINATION</text>
  <text x="1295" y="484" text-anchor="middle" class="router">R4</text>
  <text x="1295" y="510" text-anchor="middle" class="rid">RID 4.4.4.4</text>
  <text x="1295" y="536" text-anchor="middle" class="platform">LOOPBACK 4.4.4.4/32</text>

  <!-- link labels -->
  <rect x="500" y="330" width="170" height="42" class="pill pillBlue"/>
  <text x="585" y="348" text-anchor="middle" class="pillTextBlue">PRIMARY · VLAN 12</text>
  <text x="585" y="363" text-anchor="middle" class="small">ge-0/0/0.12 → eth1.12</text>
  <rect x="500" y="530" width="170" height="42" class="pill pillGreen"/>
  <text x="585" y="548" text-anchor="middle" class="pillTextGreen">BACKUP · VLAN 13</text>
  <text x="585" y="563" text-anchor="middle" class="small">ge-0/0/0.13 → eth1.13</text>
  <text x="1045" y="342" text-anchor="middle" class="label">VLAN 24</text>
  <text x="1045" y="360" text-anchor="middle" class="small">R2–R4</text>
  <text x="1045" y="628" text-anchor="middle" class="label">VLAN 34</text>
  <text x="1045" y="646" text-anchor="middle" class="small">R3–R4</text>

  <!-- directional cost note -->
  <rect x="118" y="735" width="1364" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="145" y="762" class="small">Observed profile: R1→R3 OSPF cost 10 · R3→R4 cost 1 · R1→R4 primary via R2 metric 2 (verify directional costs live)</text>

  <!-- lower info panels -->
  <rect x="80" y="824" width="690" height="92" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="108" y="855" class="section" fill="#1e40af">Primary failure scenario</text>
  <text x="108" y="882" class="body">R2 node failure — both R1–R2 and R2–R4 become unavailable.</text>
  <text x="108" y="902" class="small">R1 must avoid R2 and use R3 → R4 for destination 4.4.4.4/32.</text>

  <rect x="790" y="824" width="730" height="92" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="818" y="855" class="section" fill="#047857">Node-protecting condition (RFC 5286 §3.2)</text>
  <text x="818" y="883" class="metric">D(R3,R4) &lt; D(R3,R2) + D(R2,R4)   →   1 &lt; 2 + 1</text>
  <text x="818" y="903" class="small">Expected from current cost profile; verify the live route metrics before acceptance.</text>
</svg>
