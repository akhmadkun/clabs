<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">LAB-018 OSPF LFA Link Protection</title>
<desc id="desc">Editable Area 0 four-router P2P diamond consistent with LAB-015 to LAB-017. R1 has primary path to R4 via R2, metric 2. The alternate via R3 costs 11 from R1 and is a candidate loop-free alternate when R1-R2 is protected.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
  <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2796d2"/><stop offset="1" stop-color="#12649a"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#24435c" flood-opacity=".14"/></filter>
</defs>
<rect width="1600" height="1000" rx="30" fill="url(#bg)"/>
