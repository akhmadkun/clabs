system {
    host-name r1;
    root-authentication { encrypted-password "$6$0S1iVwZRqnCK2Emy$KpfZ7eaoHbqI71jefPVEbIXJnGI2KUQbSTKyCa5b/oyDFhmlEuMOSoH.foAhuKFrisCAGAYYcV1b8hxTLD.fS/"; }
}
routing-options { router-id 1.1.1.1; }
interfaces {
    eth1 {
        unit 101 {
            vlan-id 101;
            family inet { address 192.168.101.1/24; }
        }
        unit 123 {
            vlan-id 123;
            family inet { address 10.10.123.1/24; }
            family iso;
        }
    }
    lo0 {
        unit 0 {
            family inet { address 1.1.1.1/32; }
            family iso { address 49.0001.0000.0000.0001.00; }
        }
    }
}
protocols {
    isis {
        level 1 disable;
        interface lo0.0 { passive; }
        interface eth1.101 { passive; }
        interface eth1.123 { level 2 { priority 80; } }
    }
}
