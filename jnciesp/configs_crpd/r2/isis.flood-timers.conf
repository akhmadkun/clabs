system {
    host-name r2;
    root-authentication { encrypted-password "$6$0S1iVwZRqnCK2Emy$KpfZ7eaoHbqI71jefPVEbIXJnGI2KUQbSTKyCa5b/oyDFhmlEuMOSoH.foAhuKFrisCAGAYYcV1b8hxTLD.fS/"; }
}
routing-options { router-id 2.2.2.2; }
interfaces {
    eth1 {
        unit 102 {
            vlan-id 102;
            family inet { address 192.168.102.1/24; }
        }
        unit 123 {
            vlan-id 123;
            family inet { address 10.10.123.2/24; }
            family iso;
        }
    }
    lo0 {
        unit 0 {
            family inet { address 2.2.2.2/32; }
            family iso { address 49.0001.0000.0000.0002.00; }
        }
    }
}
protocols {
    isis {
        level 1 disable;
        interface lo0.0 { passive; }
        interface eth1.102 { passive; }
        interface eth1.123 { level 2 { priority 100; } }
    }
}
