system {
    host-name r3;
    root-authentication { encrypted-password "$6$0S1iVwZRqnCK2Emy$KpfZ7eaoHbqI71jefPVEbIXJnGI2KUQbSTKyCa5b/oyDFhmlEuMOSoH.foAhuKFrisCAGAYYcV1b8hxTLD.fS/"; }
}
routing-options { router-id 3.3.3.3; }
interfaces {
    eth1 {
        unit 123 {
            vlan-id 123;
            family inet { address 10.10.123.3/24; }
            family iso;
        }
        unit 34 {
            vlan-id 34;
            family inet { address 10.10.34.3/24; }
            family iso;
        }
        unit 35 {
            vlan-id 35;
            family inet { address 10.10.35.3/24; }
            family iso;
        }
    }
    lo0 {
        unit 0 {
            family inet { address 3.3.3.3/32; }
            family iso { address 49.0001.0000.0000.0003.00; }
        }
    }
}
protocols {
    isis {
        level 1 disable;
        interface lo0.0 { passive; }
        interface eth1.123 { level 2 { priority 70; } }
        interface eth1.34 { point-to-point; lsp-interval 100; }
        interface eth1.35 { point-to-point; }
    }
}
