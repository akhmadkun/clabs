/* LAB-018 startup configuration: one file per router. */
interface {
    eth1 {
        unit 12 { vlan-id 12; family inet { address 10.0.12.1/30; } }
        unit 13 { vlan-id 13; family inet { address 10.0.13.1/30; } }
    }
    lo0 { unit 0 { family inet { address 10.1.1.1/32; } } }
}
routing-options { router-id 10.1.1.1; }
protocols {
    ospf {
        area 0.0.0.0 {
            interface eth1.12 { interface-type p2p; }
            interface eth1.13 { interface-type p2p; metric 10; }
            interface lo0.0 { passive; }
        }
    }
}
