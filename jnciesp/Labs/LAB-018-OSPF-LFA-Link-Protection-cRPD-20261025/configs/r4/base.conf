/* LAB-018 startup configuration: one file per router. */
interfaces {
    eth1 {
        unit 24 { vlan-id 24; family inet { address 10.0.24.2/30; } }
        unit 34 { vlan-id 34; family inet { address 10.0.34.2/30; } }
    }
    lo0 { unit 0 { family inet { address 10.1.1.4/32; } } }
}
routing-options { router-id 10.1.1.4; }
protocols {
    ospf {
        area 0.0.0.0 {
            interface eth1.24 { interface-type p2p; }
            interface eth1.34 { interface-type p2p; }
            interface lo0.0 { passive; }
        }
    }
}
