/* LAB-018 startup configuration: one file per router. */
interfaces {
    eth1 {
        unit 12 { vlan-id 12; family inet { address 10.0.12.2/30; } }
        unit 24 { vlan-id 24; family inet { address 10.0.24.1/30; } }
    }
    lo0 { unit 0 { family inet { address 10.1.1.2/32; } } }
}
routing-options { router-id 10.1.1.2; }
protocols {
    ospf {
        area 0.0.0.0 {
            interface eth1.12 { interface-type p2p; }
            interface eth1.24 { interface-type p2p; }
            interface lo0.0 { passive; }
        }
    }
}
