  <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2796d2"/><stop offset="1" stop-color="#12649a"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#24435c" flood-opacity=".14"/></filter>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4c7291"/></marker>
</defs>
<rect width="1600" height="1000" rx="30" fill="url(#bg)"/>
