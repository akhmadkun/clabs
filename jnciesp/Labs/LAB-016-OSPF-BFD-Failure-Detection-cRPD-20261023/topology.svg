<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">LAB-016 OSPF BFD Failure Detection</title>
<desc id="desc">Editable four-router Area 0 OSPF point-to-point diamond. BFD is enabled only on the R1-R3 link. R1-R3 configured target is 300 milliseconds multiplier three; initial R3 incident profile uses 600 milliseconds.</desc>
<defs>
