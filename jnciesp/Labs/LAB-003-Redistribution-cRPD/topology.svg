<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080">
<defs><style>
.title{font:700 34px Arial,sans-serif;fill:#17324d}.subtitle{font:18px Arial,sans-serif;fill:#526779}
.area{font:700 24px Arial,sans-serif}.label{font:700 22px Arial,sans-serif;fill:#102a43}.small{font:700 18px Arial,sans-serif;fill:#17324d}.text{font:17px Arial,sans-serif;fill:#17324d}.tiny{font:15px Arial,sans-serif;fill:#334e68}.ip{font:16px Arial,sans-serif;fill:#102a43}.note{font:16px Arial,sans-serif;fill:#3c5265}
.panel{stroke-width:2;rx:22;ry:22}.pill{stroke-width:1.5;rx:12;ry:12}.link{stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.router{fill:#1876aa;stroke:#0c4a6e;stroke-width:3}.routerline{stroke:white;stroke-width:4;stroke-linecap:round;fill:none}.host{fill:#fff;stroke:#91a4b7;stroke-width:2;rx:12;ry:12}
</style></defs>
<rect width="1700" height="1080" fill="#fff"/>
<text x="850" y="48" text-anchor="middle" class="title">LAB-003 — OSPF Redistribution &amp; Dual Default Routes</text>
<text x="850" y="80" text-anchor="middle" class="subtitle">Logical topology reference • cRPD 25.2R1-S1.4 • Junos route-policy export • 802.1Q VLAN links</text>

<!-- Area panels -->
<rect x="235" y="110" width="1230" height="270" fill="#eaf4ff" stroke="#acd3f7" class="panel"/>
<text x="850" y="150" text-anchor="middle" class="area" fill="#1c5fa8">Area 0 — Backbone</text>
<rect x="40" y="420" width="700" height="410" fill="#edf9ee" stroke="#bce5c1" class="panel"/>
<text x="390" y="460" text-anchor="middle" class="area" fill="#26733d">Area 1</text>
<rect x="775" y="420" width="885" height="410" fill="#fff5e4" stroke="#f2d4a5" class="panel"/>
<text x="1218" y="460" text-anchor="middle" class="area" fill="#a65a0a">Area 2</text>

<!-- Backbone link -->
<line x1="610" y1="250" x2="1058" y2="250" class="link" stroke="#2775c7"/>
<rect x="735" y="178" width="200" height="52" fill="#fff" stroke="#a8c9ea" class="pill"/>
<text x="835" y="200" text-anchor="middle" class="small" fill="#1c5fa8">VLAN 12</text>
<text x="835" y="219" text-anchor="middle" class="tiny">10.0.12.0/24 · Area 0</text>
<text x="680" y="235" text-anchor="middle" class="ip">eth1.12</text>
<text x="990" y="235" text-anchor="middle" class="ip">eth1.12</text>

<!-- R1 -->
<g transform="translate(565 255)"><circle r="44" class="router"/><path d="M-21 -17 L18 19 M-18 19 L21 -17 M-23 -17 L-11 -17 L-11 -5 M23 -17 L11 -17 L11 -5 M-23 17 L-11 17 L-11 5 M23 17 L11 17 L11 5" class="routerline"/></g>
<text x="565" y="198" text-anchor="middle" class="label">R1 (ABR)</text>
<text x="610" y="333" text-anchor="middle" class="ip">Lo0: 10.1.1.1/32</text>
<rect x="290" y="350" width="550" height="0" fill="none"/>

<!-- R2 -->
<g transform="translate(1102 255)"><circle r="44" class="router"/><path d="M-21 -17 L18 19 M-18 19 L21 -17 M-23 -17 L-11 -17 L-11 -5 M23 -17 L11 -17 L11 -5 M-23 17 L-11 17 L-11 5 M23 17 L11 17 L11 5" class="routerline"/></g>
<text x="1102" y="198" text-anchor="middle" class="label">R2 (ABR)</text>
<text x="1200" y="333" text-anchor="middle" class="ip">Lo0: 10.1.1.2/32</text>
<rect x="1290" y="184" width="145" height="100" fill="#fff" stroke="#a8c9ea" class="pill"/>
<text x="1362" y="207" text-anchor="middle" class="small" fill="#1c5fa8">Dual default</text>
<text x="1362" y="231" text-anchor="middle" class="tiny">0.0.0.0/0</text>
<text x="1362" y="251" text-anchor="middle" class="tiny">R1 + R2</text>
<text x="1362" y="270" text-anchor="middle" class="tiny">Type-5 E2</text>

<!-- Area 1 link from R1 to R3 -->
<path d="M523 255 L485 340 L425 555" class="link" stroke="#2d8a57"/>
<rect x="130" y="470" width="260" height="86" fill="#fff" stroke="#addbb2" class="pill"/>
<text x="260" y="494" text-anchor="middle" class="small" fill="#26733d">VLAN 13 · Area 1</text>
<text x="260" y="516" text-anchor="middle" class="tiny">10.0.13.0/24</text>
<text x="260" y="538" text-anchor="middle" class="tiny">R1 eth1.13 ↔ R3 eth1.13</text>

<!-- R3 -->
<g transform="translate(405 610)"><circle r="44" class="router"/><path d="M-21 -17 L18 19 M-18 19 L21 -17 M-23 -17 L-11 -17 L-11 -5 M23 -17 L11 -17 L11 -5 M-23 17 L-11 17 L-11 5 M23 17 L11 17 L11 5" class="routerline"/></g>
<text x="405" y="670" text-anchor="middle" class="label">R3 (Internal)</text>
<text x="405" y="696" text-anchor="middle" class="ip">Lo0: 10.1.1.3/32</text>
<text x="405" y="723" text-anchor="middle" class="tiny">Optional source of external LSAs</text>

<!-- Area 2 link from R2 to R4 -->
<line x1="1110" y1="300" x2="1110" y2="555" class="link" stroke="#c7771c"/>
<rect x="1132" y="392" width="230" height="85" fill="#fff" stroke="#edc78c" class="pill"/>
<text x="1247" y="416" text-anchor="middle" class="small" fill="#a65a0a">VLAN 24 · Area 2</text>
<text x="1247" y="438" text-anchor="middle" class="tiny">10.0.24.0/24</text>
<text x="1247" y="460" text-anchor="middle" class="tiny">R2 eth1.24 ↔ R4 eth1.24</text>

<!-- R4 -->
<g transform="translate(1105 610)"><circle r="44" class="router"/><path d="M-21 -17 L18 19 M-18 19 L21 -17 M-23 -17 L-11 -17 L-11 -5 M23 -17 L11 -17 L11 -5 M-23 17 L-11 17 L-11 5 M23 17 L11 17 L11 5" class="routerline"/></g>
<text x="1105" y="670" text-anchor="middle" class="label">R4 (Internal)</text>
<text x="1105" y="696" text-anchor="middle" class="ip">Lo0: 10.1.1.4/32</text>

<!-- R4 connected endpoints -->
<path d="M1145 585 L1265 545 L1300 545" class="link" stroke="#cc6b6b"/>
<path d="M1149 610 L1245 650 L1300 650" class="link" stroke="#7d5ac7"/>
<path d="M1145 634 L1260 755 L1300 755" class="link" stroke="#2aa198"/>
<text x="1220" y="536" text-anchor="middle" class="tiny">R4 eth2.0</text>
<text x="1220" y="640" text-anchor="middle" class="tiny">R4 eth3.0</text>
<text x="1220" y="745" text-anchor="middle" class="tiny">R4 eth4.0</text>

<rect x="1300" y="510" width="315" height="70" fill="#fff" stroke="#e7b9b9" class="pill"/>
<text x="1457" y="533" text-anchor="middle" class="small">EP16</text>
<text x="1457" y="553" text-anchor="middle" class="tiny">192.168.16.2/30</text>
<text x="1457" y="571" text-anchor="middle" class="tiny">Network 192.168.16.0/30</text>
<rect x="1300" y="615" width="315" height="70" fill="#fff" stroke="#cab9e8" class="pill"/>
<text x="1457" y="638" text-anchor="middle" class="small">EP17</text>
<text x="1457" y="658" text-anchor="middle" class="tiny">192.168.17.2/24</text>
<text x="1457" y="676" text-anchor="middle" class="tiny">Network 192.168.17.0/24</text>
<rect x="1300" y="720" width="315" height="70" fill="#fff" stroke="#a9dcd6" class="pill"/>
<text x="1457" y="743" text-anchor="middle" class="small">EP18</text>
<text x="1457" y="763" text-anchor="middle" class="tiny">192.168.18.2/23</text>
<text x="1457" y="781" text-anchor="middle" class="tiny">Network 192.168.18.0/23</text>

<!-- Redistribution callouts -->
<rect x="40" y="860" width="520" height="112" fill="#f7fbff" stroke="#a8c9ea" class="pill"/>
<text x="300" y="887" text-anchor="middle" class="small">R4 — Selected static routes</text>
<text x="300" y="912" text-anchor="middle" class="text">192.168.29.0/24 and 192.168.30.0/24</text>
<text x="300" y="937" text-anchor="middle" class="tiny">Exact-prefix policy → Type-5 external LSAs (E2)</text>
<text x="300" y="958" text-anchor="middle" class="tiny">Decoy 198.51.100.0/24 must NOT be exported</text>

<rect x="590" y="860" width="520" height="112" fill="#f7fbff" stroke="#a8c9ea" class="pill"/>
<text x="850" y="887" text-anchor="middle" class="small">R1 + R2 — Dual default advertisements</text>
<text x="850" y="912" text-anchor="middle" class="text">Static 0.0.0.0/0 discard on each router</text>
<text x="850" y="937" text-anchor="middle" class="tiny">Exact-match export policy → two Type-5 E2 LSAs</text>
<text x="850" y="958" text-anchor="middle" class="tiny">Control-plane simulation only; no Internet path</text>

<rect x="1140" y="860" width="520" height="112" fill="#f7fbff" stroke="#a8c9ea" class="pill"/>
<text x="1400" y="887" text-anchor="middle" class="small">Optional R3 source-route adaptation</text>
<text x="1400" y="912" text-anchor="middle" class="text">192.168.71.0/24 and 192.168.72.0/24 discard</text>
<text x="1400" y="937" text-anchor="middle" class="tiny">R3 exact-match policy → Type-5 external LSAs</text>
<text x="1400" y="958" text-anchor="middle" class="tiny">Static adaptation; not a real RIP-to-OSPF test</text>

<text x="850" y="1018" text-anchor="middle" class="note">Physical br-univ is intentionally omitted. All eth1 parent ports attach to the shared bridge; VLAN tags create the logical links shown.</text>
<text x="850" y="1045" text-anchor="middle" class="tiny">Startup configs contain addressing only. Configure router IDs, OSPF, static routes, policies, and redistribution manually.</text>
</svg>
