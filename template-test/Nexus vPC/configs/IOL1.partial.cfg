!
hostname IOL1
!
ip cef
!
interface Ethernet0/1
 description LACP-member1-to-NX1
 channel-group 10 mode active
 no shutdown
!
interface Ethernet0/2
 description LACP-member2-to-NX1
 channel-group 10 mode active
 no shutdown
!
interface Port-channel10
 description L3-LACP-to-NX1
 ip address 10.10.10.2 255.255.255.252
 no shutdown
!
interface Loopback0
 description TEST-LOOPBACK
 ip address 10.255.0.2 255.255.255.255
!
ip route 10.255.0.1 255.255.255.255 10.10.10.1
!
end
