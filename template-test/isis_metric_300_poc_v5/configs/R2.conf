system {
    host-name R2;
}
routing-options {
    router-id 2.2.2.2;
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 2.2.2.2/32;
            }
            family iso {
                address 49.0001.0000.0000.0002.00;
            }
        }
    }
    eth1 {
        unit 0 {
            family inet {
                address 10.0.12.2/30;
            }
            family iso { }
        }
    }
    eth2 {
        unit 0 {
            family inet {
                address 10.0.23.1/30;
            }
            family iso { }
        }
    }
}
protocols {
    isis {
        level 1 disable;
        interface lo0.0 {
            passive;
        }
        interface eth1.0 {
            level 2 {
                metric 10;
            }
        }
        interface eth2.0 {
            level 2 {
                metric 300;
            }
        }
    }
}
