version 17.3
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
hostname CSR2-LAB002
!
vrf definition clab-mgmt
 !
 address-family ipv4
 exit-address-family
!
no ip domain lookup
ip domain name lab.local
ip tftp source-interface GigabitEthernet1
!
username admin privilege 15 secret admin
!
interface GigabitEthernet1
 description Containerlab management
 vrf forwarding clab-mgmt
 ip address 10.0.0.15 255.255.255.0
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface GigabitEthernet2
 description LAB-002-P2P-to-CSR1
 ip address 10.0.23.2 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface Loopback100
 description LAB-002-IDENTIFIER
 ip address 192.0.2.22 255.255.255.255
!
ip route vrf clab-mgmt 0.0.0.0 0.0.0.0 10.0.0.2
!
ip ssh version 2
!
line con 0
 exec-timeout 0 0
 logging synchronous
!
line vty 0 4
 login local
 transport input ssh
!
end
