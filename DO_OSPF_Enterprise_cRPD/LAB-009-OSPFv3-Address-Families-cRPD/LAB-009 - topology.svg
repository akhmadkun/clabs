<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity=".14"/></filter></defs>
<rect width="1500" height="940" fill="#f8fafc"/>
<text x="750" y="52" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">LAB-009 · OSPFv3 Fundamentals &amp; Address Families</text>
<text x="750" y="85" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#526477">cRPD universal topology · IPv6 unicast first, then IPv4 unicast realm on the same links</text>
<rect x="72" y="120" width="1356" height="495" rx="24" fill="#dbeafe" fill-opacity=".52" stroke="#93c5fd" stroke-width="2"/>
<text x="105" y="158" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">OSPFv3 AREA 0 · TWO LOGICAL P2P LINKS</text>
<!-- dual realm links -->
<line x1="332" y1="315" x2="678" y2="315" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
<line x1="822" y1="315" x2="1168" y2="315" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
<line x1="332" y1="331" x2="678" y2="331" stroke="#f59e0b" stroke-width="4" stroke-dasharray="11 8" stroke-linecap="round"/>
<line x1="822" y1="331" x2="1168" y2="331" stroke="#f59e0b" stroke-width="4" stroke-dasharray="11 8" stroke-linecap="round"/>
<!-- link information -->
<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" text-anchor="middle">
 <rect x="333" y="188" width="265" height="98" rx="14" fill="#fff" stroke="#bfdbfe"/>
 <text x="465" y="212" font-size="16" font-weight="700" fill="#1d4ed8">VLAN 12 · eth1.12</text>
 <text x="465" y="235" font-size="13" fill="#334155">IPv4: 10.0.12.0/30</text>
 <text x="465" y="255" font-size="13" fill="#334155">IPv6: 2001:db8:100:12::/64</text>
 <rect x="902" y="188" width="265" height="98" rx="14" fill="#fff" stroke="#bfdbfe"/>
 <text x="1034" y="212" font-size="16" font-weight="700" fill="#1d4ed8">VLAN 23 · eth1.23</text>
 <text x="1034" y="235" font-size="13" fill="#334155">IPv4: 10.0.23.0/30</text>
 <text x="1034" y="255" font-size="13" fill="#334155">IPv6: 2001:db8:100:23::/64</text>
</g>
<!-- routers -->
<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" text-anchor="middle">
 <g transform="translate(260 325)"><circle r="72" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cy="-19" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M-29 15 Q0 -7 29 15 M-35 31 Q0 6 35 31" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><text y="47" font-size="23" font-weight="700" fill="#102a43">R1</text><text y="66" font-size="13" fill="#526477">RID 10.1.1.1</text></g>
 <g transform="translate(750 325)"><circle r="72" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cy="-19" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M-29 15 Q0 -7 29 15 M-35 31 Q0 6 35 31" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><text y="47" font-size="23" font-weight="700" fill="#102a43">R2</text><text y="66" font-size="13" fill="#526477">RID 10.1.1.2</text></g>
 <g transform="translate(1240 325)"><circle r="72" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cy="-19" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M-29 15 Q0 -7 29 15 M-35 31 Q0 6 35 31" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><text y="47" font-size="23" font-weight="700" fill="#102a43">R3</text><text y="66" font-size="13" fill="#526477">RID 10.1.1.3</text></g>
</g>
<!-- address callouts -->
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
 <rect x="114" y="423" width="292" height="87" rx="12" fill="#fff" stroke="#cbd5e1"/>
 <text x="260" y="448" font-size="15" font-weight="700" fill="#102a43">R1 loopbacks</text>
 <text x="260" y="471" font-size="13" fill="#334155">IPv4 10.1.1.1/32</text><text x="260" y="491" font-size="13" fill="#334155">IPv6 2001:db8:ffff::1/128</text>
 <rect x="604" y="423" width="292" height="87" rx="12" fill="#fff" stroke="#cbd5e1"/>
 <text x="750" y="448" font-size="15" font-weight="700" fill="#102a43">R2 loopbacks</text>
 <text x="750" y="471" font-size="13" fill="#334155">IPv4 10.1.1.2/32</text><text x="750" y="491" font-size="13" fill="#334155">IPv6 2001:db8:ffff::2/128</text>
 <rect x="1094" y="423" width="292" height="87" rx="12" fill="#fff" stroke="#cbd5e1"/>
 <text x="1240" y="448" font-size="15" font-weight="700" fill="#102a43">R3 loopbacks</text>
 <text x="1240" y="471" font-size="13" fill="#334155">IPv4 10.1.1.3/32</text><text x="1240" y="491" font-size="13" fill="#334155">IPv6 2001:db8:ffff::3/128</text>
</g>
<rect x="72" y="650" width="1356" height="208" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="110" y="691" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#102a43">Two realms, one OSPFv3 protocol family</text>
<g font-family="Inter,Arial,sans-serif">
 <line x1="120" y1="733" x2="200" y2="733" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/><text x="221" y="738" font-size="16" font-weight="700" fill="#1d4ed8">Default IPv6-unicast realm</text><text x="221" y="762" font-size="14" fill="#475569">Advertises 2001:db8:ffff::N/128 loopbacks → routing table inet6.0</text>
 <line x1="760" y1="733" x2="840" y2="733" stroke="#f59e0b" stroke-width="4" stroke-dasharray="11 8" stroke-linecap="round"/><text x="861" y="738" font-size="16" font-weight="700" fill="#b45309">Additional ipv4-unicast realm</text><text x="861" y="762" font-size="14" fill="#475569">Advertises 10.1.1.N/32 loopbacks → routing table inet.0</text>
 <text x="120" y="814" font-size="14" fill="#475569">OSPFv3 Hellos use IPv6 link-local addresses; enable family inet6 on every OSPFv3 link, even for IPv4 routing.</text>
</g>
<text x="750" y="901" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Conceptual logical topology only · eth1 parent interfaces continue using the existing external br-univ · no YAML changes</text>
</svg>