<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity=".13"/></filter>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
</defs>
<rect width="1400" height="900" fill="#f8fafc"/>
<text x="700" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">LAB-008 · OSPF Multi-Area Adjacency</text>
<text x="700" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#526477">One logical interface · Two OSPF areas · Junos cRPD universal topology</text>
<!-- Area backgrounds -->
<rect x="70" y="125" width="1260" height="220" rx="22" fill="#dbeafe" fill-opacity=".74" stroke="#60a5fa" stroke-width="2"/>
<text x="95" y="160" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">AREA 0 · PRIMARY ADJACENCY</text>
<rect x="70" y="380" width="1260" height="330" rx="22" fill="#dcfce7" fill-opacity=".52" stroke="#4ade80" stroke-width="2" stroke-opacity=".8"/>
<text x="700" y="410" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#15803d">AREA 1 · ALTERNATE PATH + SECONDARY ADJACENCY</text>
<!-- R1-R2 direct multi-area link -->
<line x1="330" y1="250" x2="1070" y2="250" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
<line x1="330" y1="266" x2="1070" y2="266" stroke="#16a34a" stroke-width="3" stroke-dasharray="13 9" stroke-linecap="round"/>
<rect x="468" y="181" width="464" height="54" rx="12" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
<text x="700" y="202" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">VLAN 12 · eth1.12 · 10.0.12.0/30</text>
<text x="700" y="222" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">Primary Area 0 / Secondary Area 1 (metric 5)</text>
<!-- alternative area 1 path -->
<path d="M285 490 L510 680 L890 680 L1115 490" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="Inter,Arial,sans-serif" font-size="15" fill="#166534" font-weight="600">
  <rect x="333" y="552" width="175" height="52" rx="9" fill="#ffffff" stroke="#86efac"/>
  <text x="420" y="573" text-anchor="middle">VLAN 13</text><text x="420" y="592" text-anchor="middle" font-size="13">10.0.13.0/30 · cost 10</text>
  <rect x="612" y="647" width="176" height="52" rx="9" fill="#ffffff" stroke="#86efac"/>
  <text x="700" y="668" text-anchor="middle">VLAN 34</text><text x="700" y="687" text-anchor="middle" font-size="13">10.0.34.0/30 · cost 10</text>
  <rect x="893" y="552" width="175" height="52" rx="9" fill="#ffffff" stroke="#86efac"/>
  <text x="980" y="573" text-anchor="middle">VLAN 24</text><text x="980" y="592" text-anchor="middle" font-size="13">10.0.24.0/30 · cost 10</text>
</g>
<!-- routers -->
<g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" text-anchor="middle">
 <g transform="translate(250 250)"><circle r="72" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cy="-17" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M-28 16 Q0 -5 28 16 M-34 31 Q0 7 34 31" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><text y="46" font-size="23" font-weight="700" fill="#102a43">R1</text><text y="64" font-size="13" fill="#526477">RID 10.1.1.1</text></g>
 <g transform="translate(1150 250)"><circle r="72" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cy="-17" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M-28 16 Q0 -5 28 16 M-34 31 Q0 7 34 31" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><text y="46" font-size="23" font-weight="700" fill="#102a43">R2</text><text y="64" font-size="13" fill="#526477">RID 10.1.1.2</text></g>
 <g transform="translate(250 490)"><circle r="72" fill="#fff" stroke="#16a34a" stroke-width="3"/><circle cy="-17" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M-28 16 Q0 -5 28 16 M-34 31 Q0 7 34 31" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><text y="46" font-size="23" font-weight="700" fill="#102a43">R3</text><text y="64" font-size="13" fill="#526477">RID 10.1.1.3</text></g>
 <g transform="translate(1150 490)"><circle r="72" fill="#fff" stroke="#16a34a" stroke-width="3"/><circle cy="-17" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><path d="M-28 16 Q0 -5 28 16 M-34 31 Q0 7 34 31" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/><text y="46" font-size="23" font-weight="700" fill="#102a43">R4</text><text y="64" font-size="13" fill="#526477">RID 10.1.1.4</text></g>
</g>
<!-- ABR / internal labels -->
<rect x="176" y="340" width="148" height="29" rx="14" fill="#1d4ed8"/><text x="250" y="359" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">ABR</text>
<rect x="1076" y="340" width="148" height="29" rx="14" fill="#1d4ed8"/><text x="1150" y="359" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">ABR</text>
<!-- path objective -->
<rect x="360" y="755" width="680" height="72" rx="14" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
<text x="700" y="782" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#102a43">Route-choice test on R2</text>
<text x="700" y="807" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Before: R2 → R4 → R3 (cost 20) · After: R2 → R1 → R3 (cost 15)</text>
<text x="700" y="866" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Solid blue = primary Area 0 · Dashed green overlay = secondary Area 1 over the same VLAN 12 link</text>
</svg>