<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
 <rect x="405" y="218" width="150" height="58" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
 <text x="480" y="241" font-size="14" font-weight="700" fill="#1e40af">R1–R2 · VLAN 12</text><text x="480" y="261" font-size="13" fill="#334155">10.0.12.0/30</text>
