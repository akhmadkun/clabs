 <rect x="825" y="440" width="160" height="62" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
 <text x="905" y="464" font-size="15" font-weight="700" fill="#1e40af">R3–R4 · VLAN 34</text><text x="905" y="485" font-size="13" fill="#334155">10.0.34.0/30</text>
