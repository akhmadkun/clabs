<rect x="170" y="745" width="1060" height="64" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="205" y="772" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Target on R1:</text>
<text x="315" y="772" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">Two equal-cost paths to 10.1.1.4/32 (metric 2 each); adjust VLAN 12 cost to prefer the R3 path.</text>
<text x="205" y="795" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">Preference tests compare candidate routes for the same prefix. ECMP target is the routing table (RIB), not traffic ratio.</text>
</svg>
